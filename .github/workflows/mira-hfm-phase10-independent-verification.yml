name: Mira HFM Phase 10 Independent Verification

on:
  push:
    branches:
      - work/mira-hfm-v02-phase7-emergency-backup
    paths:
      - 'services/mira-hfm-*.js'
      - 'services/mira-memory-*.js'
      - 'services/mira-legacy-memory-knowledge-adapter.js'
      - 'tests/mira-hfm-*.test.js'
      - 'tests/mira-memory-*.test.js'
      - 'tests/mira-legacy-memory-knowledge-adapter.test.js'
      - 'docs/architecture/mira-hybrid-memory/phase7/**'
      - 'docs/architecture/mira-hybrid-memory/phase8/**'
      - 'docs/architecture/mira-hybrid-memory/phase9/**'
      - 'docs/architecture/mira-hybrid-memory/phase10/**'
      - '.github/workflows/mira-hfm-phase7-emergency-backup.yml'
      - '.github/workflows/mira-hfm-phase8-learning-evolution.yml'
      - '.github/workflows/mira-hfm-phase9-retrieval-index.yml'
      - '.github/workflows/mira-hfm-phase10-independent-verification.yml'
  pull_request:
    branches:
      - work/mira-hfm-v02-phase7-emergency-backup
    paths:
      - 'services/mira-hfm-*.js'
      - 'services/mira-memory-*.js'
      - 'services/mira-legacy-memory-knowledge-adapter.js'
      - 'tests/mira-hfm-*.test.js'
      - 'tests/mira-memory-*.test.js'
      - 'tests/mira-legacy-memory-knowledge-adapter.test.js'
      - 'docs/architecture/mira-hybrid-memory/phase7/**'
      - 'docs/architecture/mira-hybrid-memory/phase8/**'
      - 'docs/architecture/mira-hybrid-memory/phase9/**'
      - 'docs/architecture/mira-hybrid-memory/phase10/**'
      - '.github/workflows/mira-hfm-phase7-emergency-backup.yml'
      - '.github/workflows/mira-hfm-phase8-learning-evolution.yml'
      - '.github/workflows/mira-hfm-phase9-retrieval-index.yml'
      - '.github/workflows/mira-hfm-phase10-independent-verification.yml'

permissions:
  contents: read

jobs:
  phase10-independent-cross-phase-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Re-run Phase 7 encrypted backup and recovery contracts
        run: |
          set -euo pipefail
          node tests/mira-hfm-pinned-backup-directory.test.js
          node tests/mira-hfm-emergency-backup.test.js
          node tests/mira-hfm-google-drive-backup-adapter.test.js
          node tests/mira-hfm-key-provider-contract.test.js
          node tests/mira-hfm-authoritative-snapshot.test.js
          node tests/mira-hfm-local-staging-snapshot-source.test.js
          node tests/mira-hfm-staging-backup-drill.test.js
          node tests/mira-hfm-source-provenance-contract.test.js
          node tests/mira-hfm-signed-provenance-policy.test.js
          node tests/mira-hfm-policy-state-provider-contract.test.js
          node tests/mira-hfm-provenance-evidence-verifier.test.js
          node tests/mira-hfm-recovery-verification.test.js
      - name: Re-run Phase 8 learning, retrieval and Evolution contracts
        run: |
          set -euo pipefail
          node tests/mira-memory-conflict-assessment.test.js
          node tests/mira-memory-project-mapping-contract.test.js
          node tests/mira-memory-project-mapping-owner-approval.test.js
          node tests/mira-legacy-memory-knowledge-adapter.test.js
          node tests/mira-hfm-work-learning-adapter.test.js
          node tests/mira-hfm-work-learning-retrieval.test.js
          node tests/mira-hfm-work-learning-projection.test.js
          node tests/mira-hfm-evolution-prepare.test.js
          node tests/mira-hfm-work-learning-staging-source.test.js
      - name: Re-run Phase 9 retrieval and performance contracts
        run: |
          set -euo pipefail
          node tests/mira-memory-unified-facade.test.js
          node tests/mira-hfm-retrieval-index.test.js
          node tests/mira-hfm-retrieval-index-performance.test.js
      - name: Run independent cross-phase integration and static safety verification
        run: |
          set -euo pipefail
          node tests/mira-hfm-phase10-independent-verification.test.js
          echo "NETWORK_REQUESTS=0"
          echo "PERSISTENT_INDEX_WRITES=0"
          echo "PRODUCTION_MEMORY_TOUCHED=NO"
          echo "LIVE_DRIVE_API_CALLS=0"
          echo "CANONICAL_MEMORY_WRITTEN=NO"
          echo "CANONICAL_KNOWLEDGE_WRITTEN=NO"
          echo "RESTORE_EXECUTED=NO"
          echo "EVOLUTION_APPLIED=NO"
          echo "RESULT=MIRA_HFM_PHASE10_INDEPENDENT_VERIFICATION_COMPLETE"
