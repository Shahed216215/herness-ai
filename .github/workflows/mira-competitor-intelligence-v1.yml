name: Mira Competitor Intelligence v1 Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - 'services/mira-seo-competitor-intelligence.js'
      - 'services/mira-seo-research-orchestrator.js'
      - 'services/mira-seo-content-gap-report.js'
      - 'routes/mira-seo-report.js'
      - 'server.js'
      - 'public/index.html'
      - 'tools/seo-content-gap-report.js'
      - 'tests/mira-seo-content-gap-report.test.js'
      - 'tests/mira-seo-report-route.test.js'
      - 'tests/mira-seo-report-ui.test.js'
      - 'services/mira-marketing-workflow-orchestrator.js'
      - 'routes/mira-marketing-workflow.js'
      - 'tests/marketing-workflow-competitor-input.test.js'
      - 'tests/mira-seo-competitor-intelligence.test.js'
      - 'tests/mira-seo-research-orchestrator.test.js'
      - 'docs/seo/MIRA-COMPETITOR-INTELLIGENCE-V1-20261106.md'
      - '.github/workflows/mira-competitor-intelligence-v1.yml'
  push:
    branches:
      - 'work/mira-competitor-intelligence-v1-20261106'
    paths:
      - 'services/mira-seo-competitor-intelligence.js'
      - 'services/mira-seo-content-gap-report.js'
      - 'routes/mira-seo-report.js'
      - 'server.js'
      - 'public/index.html'
      - 'tools/seo-content-gap-report.js'
      - 'tests/mira-seo-content-gap-report.test.js'
      - 'tests/mira-seo-report-route.test.js'
      - 'tests/mira-seo-report-ui.test.js'
      - 'services/mira-marketing-workflow-orchestrator.js'
      - 'routes/mira-marketing-workflow.js'
      - 'tests/marketing-workflow-competitor-input.test.js'
      - 'services/mira-seo-research-orchestrator.js'
      - 'tests/mira-seo-competitor-intelligence.test.js'
      - 'tests/mira-seo-research-orchestrator.test.js'
      - 'docs/seo/MIRA-COMPETITOR-INTELLIGENCE-V1-20261106.md'
      - '.github/workflows/mira-competitor-intelligence-v1.yml'

permissions:
  contents: read

jobs:
  competitor-intelligence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Syntax checks
        run: node --check services/mira-seo-competitor-intelligence.js && node --check services/mira-seo-research-orchestrator.js && node --check services/mira-seo-content-gap-report.js && node --check routes/mira-seo-report.js && node --check server.js && node --check tools/seo-content-gap-report.js && node --check tests/mira-seo-report-route.test.js && node --check services/mira-marketing-workflow-orchestrator.js && node --check routes/mira-marketing-workflow.js && node --check tests/marketing-workflow-competitor-input.test.js && node --check tests/mira-seo-report-ui.test.js && node --check tests/mira-seo-competitor-intelligence.test.js && node --check tests/mira-seo-research-orchestrator.test.js && node --check tests/mira-seo-content-gap-report.test.js
      - name: Competitor intelligence regression
        run: node tests/mira-seo-competitor-intelligence.test.js
      - name: Governed multi-query research regression
        run: node tests/mira-seo-research-orchestrator.test.js
      - name: Content gap and deterministic SEO report regression
        run: node tests/mira-seo-content-gap-report.test.js
      - name: Admin SEO report route regression
        run: node tests/mira-seo-report-route.test.js
      - name: SEO report dashboard integration regression
        run: node tests/mira-seo-report-ui.test.js
      - name: Marketing workflow competitor input regression
        run: node tests/marketing-workflow-competitor-input.test.js
