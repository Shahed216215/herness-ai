name: Mira HFM Phase 7 Emergency Backup

on:
  push:
    branches:
      - work/mira-hfm-v02-phase7-emergency-backup
    paths:
      - 'services/mira-hfm-pinned-directory.js'
      - 'services/mira-hfm-emergency-backup.js'
      - 'services/mira-hfm-google-drive-backup-adapter.js'
      - 'services/mira-hfm-authoritative-snapshot.js'
      - 'services/mira-hfm-local-staging-snapshot-source.js'
      - 'services/mira-hfm-authorization-decision.js'
      - 'services/mira-hfm-staging-backup-drill.js'
      - 'services/mira-hfm-source-provenance-contract.js'
      - 'services/mira-hfm-recovery-verification.js'
      - 'services/mira-hfm-key-provider-contract.js'
      - 'tests/mira-hfm-pinned-backup-directory.test.js'
      - 'tests/mira-hfm-emergency-backup.test.js'
      - 'tests/mira-hfm-google-drive-backup-adapter.test.js'
      - 'tests/mira-hfm-key-provider-contract.test.js'
      - 'tests/mira-hfm-authoritative-snapshot.test.js'
      - 'tests/mira-hfm-local-staging-snapshot-source.test.js'
      - 'tests/mira-hfm-staging-backup-drill.test.js'
      - 'tests/mira-hfm-source-provenance-contract.test.js'
      - 'tests/mira-hfm-recovery-verification.test.js'
      - 'docs/architecture/mira-hybrid-memory/phase7/**'
      - '.github/workflows/mira-hfm-phase7-emergency-backup.yml'
  pull_request:
    branches:
      - work/mira-hfm-v02-phase7-emergency-backup
    paths:
      - 'services/mira-hfm-pinned-directory.js'
      - 'services/mira-hfm-emergency-backup.js'
      - 'services/mira-hfm-google-drive-backup-adapter.js'
      - 'services/mira-hfm-authoritative-snapshot.js'
      - 'services/mira-hfm-local-staging-snapshot-source.js'
      - 'services/mira-hfm-authorization-decision.js'
      - 'services/mira-hfm-staging-backup-drill.js'
      - 'services/mira-hfm-recovery-verification.js'
      - 'services/mira-hfm-key-provider-contract.js'
      - 'tests/mira-hfm-pinned-backup-directory.test.js'
      - 'tests/mira-hfm-emergency-backup.test.js'
      - 'tests/mira-hfm-google-drive-backup-adapter.test.js'
      - 'tests/mira-hfm-key-provider-contract.test.js'
      - 'tests/mira-hfm-authoritative-snapshot.test.js'
      - 'tests/mira-hfm-local-staging-snapshot-source.test.js'
      - 'tests/mira-hfm-staging-backup-drill.test.js'
      - 'tests/mira-hfm-recovery-verification.test.js'
      - 'docs/architecture/mira-hybrid-memory/phase7/**'
      - '.github/workflows/mira-hfm-phase7-emergency-backup.yml'

permissions:
  contents: read

jobs:
  phase7-offline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run isolated emergency-backup contract tests
        run: |
          set -euo pipefail
          node tests/mira-hfm-pinned-backup-directory.test.js
          node tests/mira-hfm-emergency-backup.test.js
          node tests/mira-hfm-google-drive-backup-adapter.test.js
          node tests/mira-hfm-key-provider-contract.test.js
          node tests/mira-hfm-authoritative-snapshot.test.js
          node tests/mira-hfm-local-staging-snapshot-source.test.js
          node tests/mira-hfm-staging-backup-drill.test.js
          node tests/mira-hfm-source-provenance-contract.test.js
          node tests/mira-hfm-recovery-verification.test.js
          echo "NETWORK_REQUESTS=0"
          echo "PRODUCTION_MEMORY_TOUCHED=NO"
          echo "LIVE_DRIVE_API_CALLS=0"
          echo "BACKUP_DELETION=0"
          echo "RESULT=MIRA_HFM_PHASE7_OFFLINE_CONTRACT_COMPLETE"
