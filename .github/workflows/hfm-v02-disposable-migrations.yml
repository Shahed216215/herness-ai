name: HFM v0.2 disposable PostgreSQL migration chain

on:
  push:
    branches: [work/mira-hfm-v02-clean-integration-20261107, work/hfm-v02-security-ci-hardening-20261107]
    paths:
      - "migrations/hfm/**"
      - ".github/workflows/hfm-v02-disposable-migrations.yml"
  pull_request:
    branches: [main]
    paths:
      - "migrations/hfm/**"
      - ".github/workflows/hfm-v02-disposable-migrations.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disposable-postgres-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: hfm-ci-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Create isolated migration database and legacy runtime role
        env:
          PGPASSWORD: hfm-ci-password
        run: |
          createdb -h localhost -U postgres neondb
          psql -h localhost -U postgres -d neondb -v ON_ERROR_STOP=1 -c "CREATE ROLE mira_hfm_runtime LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS"
      - name: Apply HFM v0.2 migrations 001 through 019 in order
        env:
          PGPASSWORD: hfm-ci-password
        run: |
          set -euo pipefail
          for migration in \
            migrations/hfm/001_project_authority_registry.sql \
            migrations/hfm/002_runtime_readonly_grants.sql \
            migrations/hfm/003_authority_relational_integrity.sql \
            migrations/hfm/004_memory_repository_schema.sql \
            migrations/hfm/005_memory_writer_role_and_project_rls.sql \
            migrations/hfm/006_project_selection_read_policy.sql \
            migrations/hfm/007_authority_issuer_role.sql \
            migrations/hfm/008_project_bootstrap_issuer.sql \
            migrations/hfm/009_dedicated_login_principals.sql \
            migrations/hfm/010_memory_retrieval_runtime_role.sql \
            migrations/hfm/011_authority_issuer_role_hardening.sql \
            migrations/hfm/012_authority_approval_nonce_registry.sql \
            migrations/hfm/013_one_time_initial_project_bootstrap.sql \
            migrations/hfm/014_standing_read_authority_365_days.sql \
            migrations/hfm/015_actor_membership_operation_rls.sql \
            migrations/hfm/016_memory_record_revision_authority.sql \
            migrations/hfm/017_source_reference_record_v1_2.sql \
            migrations/hfm/018_restricted_vault_write_authority.sql \
            migrations/hfm/019_memory_reader_login_principal.sql
          do
            test -s "$migration"
            echo "APPLYING=$migration"
            psql -h localhost -U postgres -d neondb -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Verify protected HFM tables and RLS
        env:
          PGPASSWORD: hfm-ci-password
        run: |
          psql -h localhost -U postgres -d neondb -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            table_count integer;
          BEGIN
            SELECT count(*) INTO table_count
            FROM pg_class c
            JOIN pg_namespace n ON n.oid = c.relnamespace
            WHERE n.nspname = 'mira_hfm'
              AND c.relname IN (
                'project_owners','project_memberships','operation_authorities',
                'authority_audit_events','authority_approval_nonces',
                'memory_records','bootstrap_registry','standing_read_authorities'
              )
              AND c.relrowsecurity AND c.relforcerowsecurity;
            IF table_count <> 8 THEN
              RAISE EXCEPTION 'HFM_FORCED_RLS_TABLE_COUNT_MISMATCH: %', table_count;
            END IF;

            IF NOT EXISTS (
              SELECT 1 FROM pg_roles
              WHERE rolname = 'mira_hfm_memory_reader'
                AND NOT rolcanlogin AND NOT rolinherit
                AND NOT rolsuper AND NOT rolcreatedb
                AND NOT rolcreaterole AND NOT rolreplication
                AND NOT rolbypassrls
            ) THEN
              RAISE EXCEPTION 'HFM_MEMORY_READER_GROUP_ATTRIBUTES_INVALID';
            END IF;

            IF NOT EXISTS (
              SELECT 1 FROM pg_roles
              WHERE rolname = 'mira_hfm_memory_reader_login'
                AND rolcanlogin AND rolinherit
                AND NOT rolsuper AND NOT rolcreatedb
                AND NOT rolcreaterole AND NOT rolreplication
                AND NOT rolbypassrls
            ) THEN
              RAISE EXCEPTION 'HFM_MEMORY_READER_LOGIN_ATTRIBUTES_INVALID';
            END IF;

            IF (
              SELECT count(*) FROM pg_auth_members m
              JOIN pg_roles member_role ON member_role.oid = m.member
              JOIN pg_roles granted_role ON granted_role.oid = m.roleid
              WHERE member_role.rolname = 'mira_hfm_memory_reader_login'
                AND granted_role.rolname = 'mira_hfm_memory_reader'
                AND NOT m.admin_option
                AND m.inherit_option
            ) <> 1 OR EXISTS (
              SELECT 1 FROM pg_auth_members m
              JOIN pg_roles member_role ON member_role.oid = m.member
              JOIN pg_roles granted_role ON granted_role.oid = m.roleid
              WHERE member_role.rolname = 'mira_hfm_memory_reader_login'
                AND granted_role.rolname <> 'mira_hfm_memory_reader'
            ) THEN
              RAISE EXCEPTION 'HFM_MEMORY_READER_LOGIN_MEMBERSHIP_NOT_ISOLATED';
            END IF;

            IF EXISTS (
              SELECT 1 FROM pg_auth_members m
              JOIN pg_roles member_role ON member_role.oid = m.member
              WHERE member_role.rolname = 'mira_hfm_memory_reader'
            ) THEN
              RAISE EXCEPTION 'HFM_MEMORY_READER_GROUP_HAS_PARENT_ROLE';
            END IF;
          END $$;
          SELECT 'HFM_V02_DISPOSABLE_MIGRATION_CHAIN=PASS';
          SQL

      - name: Verify all-table FORCE RLS and Reader/Writer negative privilege contracts
        env:
          PGPASSWORD: hfm-ci-password
        run: |
          psql -h localhost -U postgres -d neondb -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            protected_table_count integer;
          BEGIN
            SELECT count(*) INTO protected_table_count
            FROM pg_class c
            JOIN pg_namespace n ON n.oid = c.relnamespace
            WHERE n.nspname = 'mira_hfm'
              AND c.relkind IN ('r', 'p');

            IF protected_table_count <> 11 THEN
              RAISE EXCEPTION 'HFM_EXPECTED_TABLE_INVENTORY_MISMATCH: %', protected_table_count;
            END IF;

            IF EXISTS (
              SELECT 1
              FROM pg_class c
              JOIN pg_namespace n ON n.oid = c.relnamespace
              WHERE n.nspname = 'mira_hfm'
                AND c.relkind IN ('r', 'p')
                AND (NOT c.relrowsecurity OR NOT c.relforcerowsecurity)
            ) THEN
              RAISE EXCEPTION 'HFM_TABLE_MISSING_ENABLED_OR_FORCED_RLS';
            END IF;

            -- Reader must retrieve, but must not create or mutate canonical Memory.
            IF NOT has_table_privilege('mira_hfm_memory_reader_login', 'mira_hfm.memory_records', 'SELECT')
              OR has_table_privilege('mira_hfm_memory_reader_login', 'mira_hfm.memory_records', 'INSERT')
              OR has_table_privilege('mira_hfm_memory_reader_login', 'mira_hfm.memory_records', 'UPDATE')
              OR has_table_privilege('mira_hfm_memory_reader_login', 'mira_hfm.memory_records', 'DELETE')
              OR has_table_privilege('mira_hfm_memory_reader_login', 'mira_hfm.memory_records', 'TRUNCATE')
              OR has_table_privilege('mira_hfm_memory_reader_login', 'mira_hfm.memory_record_versions', 'INSERT')
              OR has_table_privilege('mira_hfm_memory_reader_login', 'mira_hfm.memory_operation_registry', 'INSERT')
              OR has_table_privilege('mira_hfm_memory_reader_login', 'mira_hfm.memory_operation_registry', 'UPDATE')
              OR has_table_privilege('mira_hfm_memory_reader_login', 'mira_hfm.memory_audit_events', 'INSERT')
            THEN
              RAISE EXCEPTION 'HFM_READER_NEGATIVE_PRIVILEGE_CONTRACT_FAILED';
            END IF;

            IF NOT has_column_privilege('mira_hfm_memory_reader_login', 'mira_hfm.operation_authorities', 'status', 'UPDATE')
              OR NOT has_column_privilege('mira_hfm_memory_reader_login', 'mira_hfm.operation_authorities', 'consumed_at', 'UPDATE')
              OR has_table_privilege('mira_hfm_memory_reader_login', 'mira_hfm.operation_authorities', 'DELETE')
            THEN
              RAISE EXCEPTION 'HFM_READER_AUTHORITY_CONSUME_PRIVILEGE_CONTRACT_FAILED';
            END IF;

            -- Writer may perform bounded writes, never destructive table-wide actions.
            IF has_table_privilege('mira_hfm_memory_writer', 'mira_hfm.memory_records', 'DELETE')
              OR has_table_privilege('mira_hfm_memory_writer', 'mira_hfm.memory_records', 'TRUNCATE')
              OR has_table_privilege('mira_hfm_memory_writer', 'mira_hfm.memory_record_versions', 'UPDATE')
              OR has_table_privilege('mira_hfm_memory_writer', 'mira_hfm.memory_record_versions', 'DELETE')
              OR has_table_privilege('mira_hfm_memory_writer', 'mira_hfm.memory_audit_events', 'UPDATE')
              OR has_table_privilege('mira_hfm_memory_writer', 'mira_hfm.memory_audit_events', 'DELETE')
              OR has_column_privilege('mira_hfm_memory_writer', 'mira_hfm.memory_records', 'payload', 'UPDATE')
              OR has_column_privilege('mira_hfm_memory_writer', 'mira_hfm.memory_records', 'integrity_status', 'UPDATE')
            THEN
              RAISE EXCEPTION 'HFM_WRITER_NEGATIVE_PRIVILEGE_CONTRACT_FAILED';
            END IF;

            IF NOT has_column_privilege('mira_hfm_memory_writer', 'mira_hfm.memory_records', 'lifecycle', 'UPDATE')
              OR NOT has_column_privilege('mira_hfm_memory_writer', 'mira_hfm.operation_authorities', 'status', 'UPDATE')
            THEN
              RAISE EXCEPTION 'HFM_WRITER_BOUNDED_UPDATE_PRIVILEGE_CONTRACT_FAILED';
            END IF;
          END $$;
          SQL
          psql -h localhost -U postgres -d neondb -v ON_ERROR_STOP=1 <<'SQL'
          SET ROLE mira_hfm_memory_reader_login;
          DO $$
          BEGIN
            IF current_user <> 'mira_hfm_memory_reader_login' THEN
              RAISE EXCEPTION 'HFM_READER_LOGIN_ROLE_SWITCH_FAILED';
            END IF;
            IF NOT row_security_active('mira_hfm.memory_records'::regclass) THEN
              RAISE EXCEPTION 'HFM_READER_RLS_NOT_ACTIVE';
            END IF;
          END $$;
          SELECT count(*) AS reader_rows_without_project_context FROM mira_hfm.memory_records;
          RESET ROLE;
          SET ROLE mira_hfm_memory_writer;
          DO $$
          BEGIN
            IF current_user <> 'mira_hfm_memory_writer' THEN
              RAISE EXCEPTION 'HFM_WRITER_ROLE_SWITCH_FAILED';
            END IF;
            IF NOT row_security_active('mira_hfm.memory_records'::regclass) THEN
              RAISE EXCEPTION 'HFM_WRITER_RLS_NOT_ACTIVE';
            END IF;
          END $$;
          SELECT count(*) AS writer_rows_without_project_context FROM mira_hfm.memory_records;
          RESET ROLE;
          SELECT 'HFM_V02_RLS_AND_ROLE_PRIVILEGE_CONTRACTS=PASS';
          SQL
