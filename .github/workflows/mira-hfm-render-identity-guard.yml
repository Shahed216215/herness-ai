name: Mira HFM Render-base identity guard

on:
  workflow_dispatch:
  push:
    branches:
      - work/hfm-phase2-identity-guard-render-base-20261106
  pull_request:
    branches:
      - work/render-host-binding-env-compat-audit

permissions:
  contents: read

jobs:
  identity-context:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check changed runtime files
        run: |
          node --check server.js
          node --check services/mira-hfm-runtime-identity-context.js
          node --check services/mira-work-execution-engine.js
          node --check services/tool-runner.js
          node --check tools/index.js
      - name: Run fail-closed identity and dispatch tests
        run: node tests/mira-hfm-runtime-identity-context.test.js

  repository-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked dependencies
        run: npm ci
      - name: Run repository regression suite
        run: npm test
