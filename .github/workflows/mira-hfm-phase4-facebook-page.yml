name: Mira HFM Phase 4 Facebook Page Connector

on:
  push:
    branches:
      - work/mira-hfm-v02-phase4-facebook-page-connector
    paths:
      - 'services/mira-facebook-page-memory-connector.js'
      - 'tests/mira-facebook-page-memory-connector.test.js'
      - 'services/mira-facebook-page-hfm-adapter.js'
      - 'tests/mira-facebook-page-hfm-adapter.test.js'
      - 'services/mira-facebook-page-permission-contract.js'
      - 'tests/mira-facebook-page-permission-contract.test.js'
      - 'services/mira-facebook-page-permission-contract.js'
      - '.github/workflows/mira-hfm-phase4-facebook-page.yml'
      - 'docs/architecture/mira-hybrid-memory/phase4/**'
  pull_request:
    branches:
      - work/mira-hfm-v02-phase3-unified-memory-contract-core
    paths:
      - 'services/mira-facebook-page-memory-connector.js'
      - 'tests/mira-facebook-page-memory-connector.test.js'
      - '.github/workflows/mira-hfm-phase4-facebook-page.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  facebook-page-offline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run offline Facebook Page connector contract tests
        run: |
          set -euo pipefail
          node tests/mira-facebook-page-memory-connector.test.js
          node tests/mira-facebook-page-hfm-adapter.test.js
          node tests/mira-facebook-page-permission-contract.test.js
          node tests/mira-memory-provider-contract.test.js
      - name: Report external action boundary
        run: |
          echo "LIVE_META_API_CALLS=0"
          echo "FACEBOOK_POSTS_PUBLISHED=0"
          echo "PERSISTENT_MEMORY_WRITES=0"
          echo "RESULT=MIRA_HFM_PHASE4_OFFLINE_CONTRACT_CI_COMPLETE"
