permissions:
  contents: read

jobs:
  isolated-core-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run isolated Phase 2 core safety tests
        shell: bash
        run: |
          set -euo pipefail
          unset OPENAI_API_KEY GROQ_API_KEY GEMINI_API_KEY GOOGLE_APPLICATION_CREDENTIALS
          unset GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GOOGLE_REFRESH_TOKEN
          export MIRA_TEST_OFFLINE_DRIVE=1
          node tests/mira-hfm-phase2-core-safety.test.js
          node tests/mira-audit-log-safety.test.js
          node tests/mira-hfm-memory-version-recovery-policy.test.js
          node tests/mira-hfm-persistent-write-policy.test.js
          node tests/mira-hfm-persistent-wrapper-guard.test.js
          node tests/mira-hfm-tool-registry-policy-parity.test.js
          node tests/mira-hfm-tool-registry-execution-guard.test.js
          node tests/mira-hfm-direct-dispatch-boundary.test.js
          node tests/mira-hfm-direct-tool-dispatch-boundary.test.js
          node tests/mira-hfm-admin-backup-restore-authority.test.js
          node tests/mira-hfm-persistent-writer-callsite-inventory.test.js
          node tests/mira-hfm-retrieval-callsite-inventory.test.js
          node tests/mira-knowledge-state-safety-test.js
          node tests/mira-phase2-recovery-regression.test.js
          node tests/mira-local-memory-safety-test.js
          node tests/mira-memory-local-store-contract-test.js
          node tests/mira-memory-evolution-integration-test.js
          node tests/mira-memory-conflict-assessment.test.js
          node tests/mira-legacy-memory-knowledge-adapter.test.js
          node tests/mira-memory-request-authorization.test.js
          node tests/mira-memory-host-identity-contract.test.js
          node tests/mira-memory-host-authorization-adapter.test.js
          node tests/mira-memory-project-authority-contract.test.js
          node tests/mira-memory-project-owner-registry-contract.test.js
          node tests/mira-memory-host-identity-integration.test.js
          node tests/mira-memory-project-mapping-contract.test.js
          node tests/mira-memory-unified-facade.test.js
          node tests/mira-memory-domain-payload-adapter.test.js
          node tests/mira-memory-provider-contract.test.js
          node tests/mira-hfm-access-path-inventory.test.js
          node scripts/mira-hfm-access-path-inventory.js > "$RUNNER_TEMP/mira-hfm-access-inventory.txt"
          grep -E '^MIRA_HFM_(ACCESS_PATH_CANDIDATE_COUNT|PUBLIC_OR_INTERNAL_RETRIEVAL_COUNT|DIRECT_STORE_READ_COUNT|GENERIC_STORE_LOADER_COUNT|PROVIDER_OR_SNAPSHOT_READ_COUNT|CRM_CONVERSATION_READ_COUNT|WORK_LEARNING_OR_EXPERIENCE_READ_COUNT|WORK_KNOWLEDGE_READ_COUNT|ALIASED_DOMAIN_READ_COUNT|ACCESS_FILE_SUMMARY)=' "$RUNNER_TEMP/mira-hfm-access-inventory.txt"
          node tests/mira-hfm-migration-manifest.test.js
          node tests/mira-hfm-test-registry.test.js
          node tests/mira-hfm-timestamp-profile.test.js
          node tests/mira-hfm-genesis-anchor-store.test.js
          node tests/mira-hfm-local-append-arbiter.test.js
          node tests/mira-knowledge-duplicate-assessment.test.js
          node tests/mira-knowledge-cleanup-tool-boundary.test.js
          node tests/mira-hfm-boundary-inventory.test.js
          MIRA_HFM_INVENTORY_FULL=1 node scripts/mira-hfm-boundary-inventory.js
          node tests/mira-conflict-quarantine-registry.test.js
          node tests/mira-knowledge-cleanup-storage-contract.test.js
          node tests/stage19-knowledge-improvement-state-test.js
          node tests/mira-conversation-store-safety.test.js
          node tests/mira-hfm-conversation-route-contract.test.js
          node tests/mira-hfm-conversation-partial-commit.test.js
          node tests/mira-hfm-knowledge-drive-retry.test.js
          node tests/mira-work-knowledge-store-fail-closed.test.js
          node tests/mira-work-learning-store-fail-closed.test.js
          node tests/mira-autonomous-learning-canonical-store-adapter.test.js
          node tests/mira-audit-chain-independent-verifier.test.js
          echo "PRODUCTION_MEMORY_TOUCHED=NO"
          echo "REAL_GOOGLE_DRIVE_TOUCHED=NO"
          echo "NETWORK_REQUESTS=0"
          echo "EXTERNAL_ACTIONS=0"
