permissions:
  contents: read

jobs:
  isolated-core-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run isolated Phase 2 core safety tests
        shell: bash
        run: |
          set -euo pipefail
          unset OPENAI_API_KEY GROQ_API_KEY GEMINI_API_KEY GOOGLE_APPLICATION_CREDENTIALS
          unset GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GOOGLE_REFRESH_TOKEN
          export MIRA_TEST_OFFLINE_DRIVE=1
          node tests/mira-hfm-phase2-core-safety.test.js
          node tests/mira-knowledge-state-safety-test.js
          node tests/mira-phase2-recovery-regression.test.js
          node tests/mira-local-memory-safety-test.js
          node tests/mira-memory-local-store-contract-test.js
          node tests/mira-memory-evolution-integration-test.js
          node tests/mira-memory-conflict-assessment.test.js
          node tests/mira-legacy-memory-knowledge-adapter.test.js
          node tests/mira-hfm-migration-manifest.test.js
          node tests/mira-knowledge-duplicate-assessment.test.js
          node tests/mira-knowledge-cleanup-tool-boundary.test.js
          node tests/mira-hfm-boundary-inventory.test.js
          MIRA_HFM_INVENTORY_FULL=1 node scripts/mira-hfm-boundary-inventory.js
          node tests/mira-conflict-quarantine-registry.test.js
          node tests/mira-knowledge-cleanup-storage-contract.test.js
          node tests/stage19-knowledge-improvement-state-test.js
          node tests/mira-conversation-store-safety.test.js
          node tests/mira-work-knowledge-store-fail-closed.test.js
          node tests/mira-work-learning-store-fail-closed.test.js
          node tests/mira-autonomous-learning-canonical-store-adapter.test.js
          node tests/mira-audit-chain-independent-verifier.test.js
          echo "PRODUCTION_MEMORY_TOUCHED=NO"
          echo "REAL_GOOGLE_DRIVE_TOUCHED=NO"
          echo "NETWORK_REQUESTS=0"
          echo "EXTERNAL_ACTIONS=0"
