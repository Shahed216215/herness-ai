name: Mira Hybrid Memory Phase 2 Core Safety
# v0.2 follow-up: include isolated conflict-quarantine lifecycle regression coverage.
# Retrieval exclusion tests assert project-scoped filtering; no provider or production integration.
# Resolution outcome set is aligned to Contract v0.2.4 Section 30.
# Quarantine preserves malformed/integrity-failed originals and supports multi-version conflicts.
# Contract Section 30 outcome assertions are individually surfaced in CI logs.
# Resolution records bind affected versions, sources, hashes, access/trust, loss risks and recovery/verification plan.
# Conflict lifecycle explicitly records QUARANTINED -> UNDER_REVIEW -> RESOLVED/REJECTED transitions.
# Resolution is blocked unless an authorized, integrity-verified UNDER_REVIEW record exists.
# Structural conflict assessment exposes the initial DETECTED state before quarantine.
# Trusted retrieval excludes originals during both QUARANTINED and UNDER_REVIEW states.
# Independent verifier consumes only exported fixtures and externally pinned trust-anchor hashes.
# Fork regression uses a correctly hashed event with a deliberately invalid predecessor link.

on:
  push:
    branches:
      - work/mira-hfm-v02-phase2-core-safety
    paths:
      - 'knowledge.js'
      - 'tools/knowledge-backup.js'
      - 'tools/knowledge-restore.js'
      - 'tools/memory-version-recovery.js'
      - 'services/mira-knowledge-state-recovery.js'
      - 'services/mira-state-version-recovery.js'
      - 'tests/mira-phase2-recovery-regression.test.js'
      - 'services/mira-json-state-store.js'
      - 'services/mira-local-memory-store.js'
      - 'knowledge-memory-evolution.js'
      - 'services/mira-memory-conflict-assessment.js'
      - 'services/mira-conflict-quarantine-registry.js'
      - 'services/mira-audit-chain-independent-verifier.js'
      - 'tests/mira-audit-chain-independent-verifier.test.js'
      - 'tests/mira-memory-conflict-assessment.test.js'
      - 'tests/mira-conflict-quarantine-registry.test.js'
      - 'tests/mira-hfm-phase2-core-safety.test.js'
      - 'tests/mira-knowledge-state-safety-test.js'
      - 'tests/mira-local-memory-safety-test.js'
      - 'tests/mira-memory-local-store-contract-test.js'
      - 'tests/mira-memory-evolution-integration-test.js'
      - '.github/workflows/mira-hfm-phase2-core-safety.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'knowledge.js'
      - 'tools/knowledge-backup.js'
      - 'tools/knowledge-restore.js'
      - 'tools/memory-version-recovery.js'
      - 'services/mira-knowledge-state-recovery.js'
      - 'services/mira-state-version-recovery.js'
      - 'tests/mira-phase2-recovery-regression.test.js'
      - 'services/mira-json-state-store.js'
      - 'services/mira-local-memory-store.js'
      - 'knowledge-memory-evolution.js'
      - 'services/mira-memory-conflict-assessment.js'
      - 'services/mira-conflict-quarantine-registry.js'
      - 'services/mira-audit-chain-independent-verifier.js'
      - 'tests/mira-audit-chain-independent-verifier.test.js'
      - 'tests/mira-memory-conflict-assessment.test.js'
      - 'tests/mira-conflict-quarantine-registry.test.js'
      - 'tests/mira-hfm-phase2-core-safety.test.js'
      - 'tests/mira-knowledge-state-safety-test.js'
      - 'tests/mira-local-memory-safety-test.js'
      - 'tests/mira-memory-local-store-contract-test.js'
      - 'tests/mira-memory-evolution-integration-test.js'
      - '.github/workflows/mira-hfm-phase2-core-safety.yml'

permissions:
  contents: read

jobs:
  isolated-core-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run isolated Phase 2 core safety tests
        shell: bash
        run: |
          set -euo pipefail
          unset OPENAI_API_KEY GROQ_API_KEY GEMINI_API_KEY GOOGLE_APPLICATION_CREDENTIALS
          unset GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GOOGLE_REFRESH_TOKEN
          export MIRA_TEST_OFFLINE_DRIVE=1
          node tests/mira-hfm-phase2-core-safety.test.js
          node tests/mira-knowledge-state-safety-test.js
          node tests/mira-phase2-recovery-regression.test.js
          node tests/mira-local-memory-safety-test.js
          node tests/mira-memory-local-store-contract-test.js
          node tests/mira-memory-evolution-integration-test.js
          node tests/mira-memory-conflict-assessment.test.js
          node tests/mira-conflict-quarantine-registry.test.js
          node tests/mira-audit-chain-independent-verifier.test.js
          echo "PRODUCTION_MEMORY_TOUCHED=NO"
          echo "REAL_GOOGLE_DRIVE_TOUCHED=NO"
          echo "NETWORK_REQUESTS=0"
          echo "EXTERNAL_ACTIONS=0"
