name: Mira Hybrid Memory Phase 2 Core Safety
# Legacy Stage 6.2/6.2.3 E2E tests require pre-existing project-local data files; isolated store contract suites run instead.
# v0.2 follow-up: include isolated conflict-quarantine lifecycle regression coverage.
# Retrieval exclusion tests assert project-scoped filtering; no provider or production integration.
# Resolution outcome set is aligned to Contract v0.2.4 Section 30.
# Explicit accepted-version selection and separate access-change authorization are regression-tested.
# Nonzero selected existing-version index must verify against the exact preserved original digest.
# Resolution inputs reject incompatible selected-version fields for merge and retain outcomes.
# Knowledge cleanup delegates to the configured atomic local state store; Drive sync is stubbed in tests.
# Quarantine preserves malformed/integrity-failed originals and supports multi-version conflicts.
# Contract Section 30 outcome assertions are individually surfaced in CI logs.
# Resolution records bind affected versions, sources, hashes, access/trust, loss risks and recovery/verification plan.
# Conflict lifecycle explicitly records QUARANTINED -> UNDER_REVIEW -> RESOLVED/REJECTED transitions.
# Resolution is blocked unless an authorized, integrity-verified UNDER_REVIEW record exists.
# Structural conflict assessment exposes the initial DETECTED state before quarantine.
# Trusted retrieval excludes originals during both QUARANTINED and UNDER_REVIEW states.
# Independent verifier consumes only exported fixtures and externally pinned trust-anchor hashes.
# Fork regression uses a correctly hashed event with a deliberately invalid predecessor link.
# Nested payload tamper fixture is deep-cloned to preserve independent test vectors.

