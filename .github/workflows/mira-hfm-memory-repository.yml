      - "tests/mira-hfm-memory-writer-rls-migration-contract.test.js"
      - "tests/mira-hfm-daily-knowledge-post.test.js"
      - "services/mira-hfm-memory-repository.js"
      - "services/mira-hfm-authority-transaction.js"
      - "services/mira-hfm-record-schema.js"
      - "services/mira-hfm-vault-crypto.js"
      - "tests/mira-hfm-memory-repository.test.js"
      - "tests/mira-hfm-authority-transaction.test.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/mira-hfm-memory-repository.yml"

permissions:
  contents: read

concurrency:
  group: mira-hfm-memory-repository-${{ github.ref }}
  cancel-in-progress: false

jobs:
  memory-repository-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Syntax-check Memory repository modules
        run: |
          node --check services/mira-hfm-memory-repository.js
          node --check services/mira-hfm-memory-postgres-runtime.js
          node --check services/mira-hfm-daily-knowledge-post.js
          node --check services/mira-hfm-authority-transaction.js
          node --check services/mira-hfm-social-post-workflow.js
          node --check routes/mira-hfm-social-posts.js
          node --check services/mira-hfm-memory-writer-pool.js
          node --check services/mira-hfm-facebook-knowledge.js
          node --check routes/mira-hfm-facebook-knowledge.js
          node --check services/mira-hfm-authority-issuer-runtime.js
          node --check services/mira-hfm-authority-issuer-pool.js
          node --check routes/mira-hfm-authorities.js
          node --check server.js
          node --check routes/mira-hfm-projects.js
          node --check routes/mira-hfm-daily-knowledge.js
          node --check tools/facebook-knowledge-search.js
          node --check tools/facebook-knowledge-research.js
      - name: Run focused Memory repository tests
        run: |
          node tests/mira-hfm-authority-transaction.test.js
          node tests/mira-hfm-vault-crypto.test.js
          node tests/mira-hfm-record-schema.test.js
          node tests/mira-hfm-memory-repository-migration-contract.test.js
          node tests/mira-hfm-memory-repository.test.js
          node tests/mira-hfm-daily-knowledge-post.test.js
          node tests/mira-hfm-memory-postgres-runtime.test.js
          node tests/mira-hfm-memory-writer-rls-migration-contract.test.js
          node tests/mira-hfm-social-post-workflow.test.js
          node tests/mira-hfm-social-post-routes.test.js
          node tests/mira-hfm-social-post-erasure-migration-contract.test.js
          node tests/mira-hfm-facebook-knowledge.test.js
          node tests/mira-hfm-facebook-knowledge-routes.test.js
          node tests/mira-hfm-authority-issuer-routes.test.js
          node tests/mira-hfm-authority-issuer-migration-contract.test.js
          node tests/mira-hfm-facebook-knowledge-ui.test.js
          node tests/mira-hfm-facebook-knowledge-agent-tools.test.js
          node tests/mira-hfm-runtime-identity-context.test.js
          node tests/mira-hfm-project-bootstrap.test.js
          node tests/mira-hfm-project-bootstrap-migration-contract.test.js
          node tests/mira-hfm-dedicated-login-principals-migration-contract.test.js
          node tests/mira-hfm-daily-knowledge-route.test.js
          node tests/mira-hfm-authority-issuer-runtime.test.js
      - name: Run full repository regression suite
        run: npm test
