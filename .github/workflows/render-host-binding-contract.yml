name: Render host binding contract

on:
  pull_request:
    branches:
      - main
    paths:
      - "server.js"
      - "package.json"
      - "package-lock.json"
      - "tests/**"
      - ".github/workflows/render-host-binding-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-host-binding-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render-host-binding:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Run repository regression suite
        run: npm test

      - name: Run zero-network Render host contract
        run: node tests/render-host-binding-contract.test.js
