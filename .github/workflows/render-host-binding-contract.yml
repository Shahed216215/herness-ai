name: Render host binding contract

on:
  pull_request:
    branches:
      - main
    paths:
      - "server.js"
      - "tests/render-host-binding-contract.test.js"
      - ".github/workflows/render-host-binding-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-host-binding-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render-host-binding:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run zero-network Render host contract
        run: node tests/render-host-binding-contract.test.js

  render-live-http-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      MIRA_BASE_URL: https://mira-ai-agent-2pfh.onrender.com
      MIRA_LIVE_TEST_TOKEN: ${{ secrets.MIRA_LIVE_TEST_TOKEN }}
    steps:
      - name: Check live Render health endpoint
        run: |
          node <<'NODE'
          const assert = require("node:assert/strict");

          const base = process.env.MIRA_BASE_URL.endsWith("/") ? process.env.MIRA_BASE_URL.slice(0, -1) : process.env.MIRA_BASE_URL;

          async function request(path, options = {}) {
            return fetch(base + path, {
              ...options,
              signal: AbortSignal.timeout(20000)
            });
          }

          async function main() {
            let healthResponse;
            let lastError;
            for (let attempt = 1; attempt <= 4; attempt += 1) {
              try {
                healthResponse = await request("/api/health");
                if (healthResponse.status === 200) break;
                lastError = new Error("HTTP " + healthResponse.status);
              } catch (error) {
                lastError = error;
              }
              if (attempt < 4) {
                await new Promise(resolve => setTimeout(resolve, 5000));
              }
            }

            assert.ok(healthResponse, "Health endpoint did not respond: " + String(lastError));
            assert.equal(healthResponse.status, 200, "Health endpoint must return HTTP 200");
            const health = await healthResponse.json();
            assert.equal(health.success, true);
            assert.equal(health.status, "ok");
            assert.equal(health.service, "Mira AI Agent");
            console.log("PASS live-render-health status=200 service=Mira-AI-Agent");

            const agentResponse = await request("/api/agent", {
              method: "POST",
              headers: { "content-type": "application/json" },
              // Empty body is intentionally invalid if auth is accidentally bypassed.
              // This makes the probe fail closed without triggering agent execution.
              body: JSON.stringify({})
            });
            assert.equal(
              agentResponse.status,
              401,
              "Unauthenticated Run Agent request must be rejected before execution"
            );
            console.log("PASS live-render-run-agent-unauthenticated status=401");

            // Safe authenticated probe: an empty JSON body is rejected by
            // /api/agent validation before memory retrieval, AI generation,
            // provider calls, or tool execution.
            const testToken = process.env.MIRA_LIVE_TEST_TOKEN;
            if (!testToken) {
              console.log("INCONCLUSIVE live-render-run-agent-authenticated: MIRA_LIVE_TEST_TOKEN secret is not configured");
              return;
            }

            const authenticatedProbe = await request("/api/agent", {
              method: "POST",
              headers: {
                "content-type": "application/json",
                authorization: "Bearer " + testToken
              },
              body: JSON.stringify({})
            });
            assert.equal(
              authenticatedProbe.status,
              400,
              "Authenticated empty-body probe must pass auth and stop at command validation"
            );
            const probeBody = await authenticatedProbe.json();
            assert.equal(probeBody.success, false);
            assert.equal(probeBody.error, "Command must be a string.");
            console.log("PASS live-render-run-agent-authenticated-validation status=400 ai-provider=NOT_CALLED tools=NOT_CALLED");
          }

          main().catch(error => {
            console.error("FAIL live-render-http-smoke:", error.message);
            process.exitCode = 1;
          });
          NODE
