name: Mira HFM PostgreSQL migration integration

on:
  push:
    branches:
      - work/mira-hfm-v02-runtime-integration
    paths:
      - "migrations/hfm/**"
      - "services/mira-hfm-authority-issuer-runtime.js"
      - "services/mira-hfm-authority-approval.js"
      - "services/mira-hfm-authority-transaction.js"
      - "services/mira-hfm-standing-read-authority.js"
      - "tests/mira-hfm-standing-read-authority*.test.js"
      - ".github/workflows/hfm-postgres-migrations.yml"
  pull_request:
    paths:
      - "migrations/hfm/**"
      - "services/mira-hfm-authority-issuer-runtime.js"
      - "services/mira-hfm-authority-approval.js"
      - "services/mira-hfm-authority-transaction.js"
      - "services/mira-hfm-standing-read-authority.js"
      - "tests/mira-hfm-standing-read-authority*.test.js"
      - ".github/workflows/hfm-postgres-migrations.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-migration-chain:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: hfm-ci-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - name: Create isolated HFM test database and legacy runtime role
        run: |
          docker exec "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U postgres -d postgres -c "CREATE DATABASE neondb"
          docker exec "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U postgres -d postgres -c "CREATE ROLE mira_hfm_runtime LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS"

      - name: Apply canonical HFM migrations 001 through 015 in order
        run: |
          set -euo pipefail
          for migration in \
            migrations/hfm/001_project_authority_registry.sql \
            migrations/hfm/002_runtime_readonly_grants.sql \
            migrations/hfm/003_authority_relational_integrity.sql \
            migrations/hfm/004_memory_repository_schema.sql \
            migrations/hfm/005_memory_writer_role_and_project_rls.sql \
            migrations/hfm/006_project_selection_read_policy.sql \
            migrations/hfm/007_authority_issuer_role.sql \
            migrations/hfm/008_project_bootstrap_issuer.sql \
            migrations/hfm/009_dedicated_login_principals.sql \
            migrations/hfm/010_memory_retrieval_runtime_role.sql \
            migrations/hfm/011_authority_issuer_role_hardening.sql \
            migrations/hfm/012_authority_approval_nonce_registry.sql \
            migrations/hfm/013_one_time_initial_project_bootstrap.sql \
            migrations/hfm/014_standing_read_authority_365_days.sql \
            migrations/hfm/015_actor_membership_operation_rls.sql
            migrations/hfm/016_memory_record_revision_authority.sql
          do
            echo "APPLYING=$migration"
            docker exec -i "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U postgres -d neondb < "$migration"
          done

      - name: Exercise one-time bootstrap and issuer nonce flow under PostgreSQL RLS
        shell: bash
        run: |
          set -euo pipefail
          PG="${{ job.services.postgres.id }}"

          docker exec "$PG" psql -v ON_ERROR_STOP=1 -U postgres -d neondb -c "CREATE ROLE mira_hfm_bootstrap_login LOGIN INHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS"
          docker exec "$PG" psql -v ON_ERROR_STOP=1 -U postgres -d neondb -c "GRANT mira_hfm_bootstrap_operator TO mira_hfm_bootstrap_login"
          docker exec "$PG" psql -v ON_ERROR_STOP=1 -U postgres -d neondb -c "BEGIN; SET LOCAL ROLE mira_hfm_bootstrap_login; SELECT set_config('mira.project_id', 'project-ci', true); SELECT set_config('mira.actor_id', 'mira:mira.admins:11111111-1111-4111-8111-111111111111', true); SELECT set_config('mira.bootstrap_approval_ref', 'ci-bootstrap-001', true); INSERT INTO mira_hfm.bootstrap_registry (bootstrap_key, project_id, actor_id, approval_ref) VALUES ('initial', 'project-ci', 'mira:mira.admins:11111111-1111-4111-8111-111111111111', 'ci-bootstrap-001'); INSERT INTO mira_hfm.project_owners (project_id, owner_actor_id, status, revision, assignment_evidence_ref, approval_ref, assigned_by_actor_id, assigned_at, updated_at) VALUES ('project-ci', 'mira:mira.admins:11111111-1111-4111-8111-111111111111', 'ACTIVE', 1, 'bootstrap:ci-bootstrap-001', 'ci-bootstrap-001', 'mira:mira.admins:11111111-1111-4111-8111-111111111111', clock_timestamp(), clock_timestamp()); INSERT INTO mira_hfm.project_memberships (membership_id, project_id, actor_id, membership_role, permissions, status, revision, valid_from, expires_at, granted_by_actor_id, approval_ref) VALUES ('membership-ci', 'project-ci', 'mira:mira.admins:11111111-1111-4111-8111-111111111111', 'ADMIN', '{\"operations\":[\"memory.read\",\"memory.write\",\"memory.update\",\"memory.trash\",\"memory.restore\"]}'::jsonb, 'ACTIVE', 1, clock_timestamp() - interval '1 minute', NULL, 'mira:mira.admins:11111111-1111-4111-8111-111111111111', 'ci-bootstrap-001'); INSERT INTO mira_hfm.authority_audit_events (event_id, project_id, actor_id, event_type, request_id, occurred_at, approval_ref, details) VALUES ('ci-project-bootstrapped', 'project-ci', 'mira:mira.admins:11111111-1111-4111-8111-111111111111', 'PROJECT_BOOTSTRAPPED', 'ci-bootstrap-request', clock_timestamp(), 'ci-bootstrap-001', '{\"oneTimeOnly\":true}'::jsonb); COMMIT"

          docker exec "$PG" psql -v ON_ERROR_STOP=1 -U postgres -d neondb -c "SELECT 1 / CASE WHEN (SELECT count(*) FROM mira_hfm.bootstrap_registry WHERE bootstrap_key = 'initial') = 1 AND (SELECT count(*) FROM mira_hfm.project_owners WHERE project_id = 'project-ci') = 1 AND (SELECT count(*) FROM mira_hfm.project_memberships WHERE project_id = 'project-ci' AND actor_id = 'mira:mira.admins:11111111-1111-4111-8111-111111111111') = 1 AND (SELECT count(*) FROM mira_hfm.authority_audit_events WHERE event_id = 'ci-project-bootstrapped') = 1 THEN 1 ELSE 0 END"

          if docker exec "$PG" psql -v ON_ERROR_STOP=1 -U postgres -d neondb -c "BEGIN; SET LOCAL ROLE mira_hfm_bootstrap_login; SELECT set_config('mira.project_id', 'project-second', true); SELECT set_config('mira.actor_id', 'mira:mira.admins:11111111-1111-4111-8111-111111111111', true); SELECT set_config('mira.bootstrap_approval_ref', 'ci-bootstrap-002', true); INSERT INTO mira_hfm.bootstrap_registry (bootstrap_key, project_id, actor_id, approval_ref) VALUES ('initial', 'project-second', 'mira:mira.admins:11111111-1111-4111-8111-111111111111', 'ci-bootstrap-002'); COMMIT" >/tmp/hfm-bootstrap-replay.log 2>&1; then
            echo "HFM_CI_BOOTSTRAP_LATCH_REPLAY_WAS_ALLOWED"
            exit 1
          fi

          if docker exec "$PG" psql -v ON_ERROR_STOP=1 -U postgres -d neondb -c "BEGIN; SET LOCAL ROLE mira_hfm_bootstrap_login; SELECT set_config('mira.project_id', 'project-second', true); SELECT set_config('mira.actor_id', 'mira:mira.admins:11111111-1111-4111-8111-111111111111', true); SELECT set_config('mira.bootstrap_approval_ref', 'ci-bootstrap-002', true); INSERT INTO mira_hfm.project_owners (project_id, owner_actor_id, status, revision, assignment_evidence_ref, approval_ref, assigned_by_actor_id, assigned_at, updated_at) VALUES ('project-second', 'mira:mira.admins:11111111-1111-4111-8111-111111111111', 'ACTIVE', 1, 'bootstrap:ci-bootstrap-002', 'ci-bootstrap-002', 'mira:mira.admins:11111111-1111-4111-8111-111111111111', clock_timestamp(), clock_timestamp()); COMMIT" >/tmp/hfm-bootstrap-owner-bypass.log 2>&1; then
            echo "HFM_CI_BOOTSTRAP_OWNER_WITHOUT_LATCH_WAS_ALLOWED"
            exit 1
          fi

          docker exec "$PG" psql -v ON_ERROR_STOP=1 -U postgres -d neondb -c "BEGIN; SET LOCAL ROLE mira_hfm_authority_issuer_login; SELECT current_user, pg_has_role(current_user, 'mira_hfm_authority_issuer', 'MEMBER') AS issuer_membership, pg_has_role(current_user, 'mira_hfm_authority_issuer', 'USAGE') AS issuer_inherited, has_table_privilege(current_user, 'mira_hfm.authority_approval_nonces', 'INSERT') AS nonce_insert_privilege, current_setting('mira.project_id', true) AS project_before_scope; SELECT set_config('mira.project_id', 'project-ci', true); SELECT set_config('mira.actor_id', 'mira:mira.admins:11111111-1111-4111-8111-111111111111', true); SELECT (project_id = NULLIF(current_setting('mira.project_id', true), '')) AS project_match, (actor_id = NULLIF(current_setting('mira.actor_id', true), '')) AS actor_match, (approver_actor_id = NULLIF(current_setting('mira.actor_id', true), '')) AS approver_match, (resource = 'memory:project:' || NULLIF(current_setting('mira.project_id', true), '')) AS resource_match, (consumed_at IS NULL) AS unused, (issued_at <= clock_timestamp()) AS issued_time_valid, (expires_at > clock_timestamp()) AS expiry_future, (expires_at <= clock_timestamp() + interval '5 minutes') AS expiry_window_valid FROM (SELECT 'project-ci'::text AS project_id, 'mira:mira.admins:11111111-1111-4111-8111-111111111111'::text AS actor_id, 'mira:mira.admins:11111111-1111-4111-8111-111111111111'::text AS approver_actor_id, 'memory:project:project-ci'::text AS resource, NULL::timestamptz AS consumed_at, clock_timestamp() AS issued_at, clock_timestamp() + interval '60 seconds' AS expires_at) checks; ROLLBACK"
          docker exec "$PG" psql -v ON_ERROR_STOP=1 -U postgres -d neondb -c "SELECT policyname, permissive, roles, cmd, qual, with_check FROM pg_policies WHERE schemaname = 'mira_hfm' AND tablename = 'authority_approval_nonces' ORDER BY policyname"
          docker exec "$PG" psql -v ON_ERROR_STOP=1 -U postgres -d neondb -c "BEGIN; SET LOCAL ROLE mira_hfm_authority_issuer_login; SELECT set_config('mira.project_id', 'project-ci', true); SELECT set_config('mira.actor_id', 'mira:mira.admins:11111111-1111-4111-8111-111111111111', true); INSERT INTO mira_hfm.authority_approval_nonces (nonce_hash, approval_ref, project_id, actor_id, approver_actor_id, operation, resource, purpose, issued_at, expires_at) VALUES (repeat('a', 64), 'ci-approval-001', 'project-ci', 'mira:mira.admins:11111111-1111-4111-8111-111111111111', 'mira:mira.admins:11111111-1111-4111-8111-111111111111', 'memory.read', 'memory:project:project-ci', 'postgres ci', clock_timestamp(), clock_timestamp() + interval '60 seconds'); INSERT INTO mira_hfm.authority_audit_events (event_id, project_id, actor_id, event_type, request_id, occurred_at, approval_ref, details) VALUES ('ci-approval-issued', 'project-ci', 'mira:mira.admins:11111111-1111-4111-8111-111111111111', 'APPROVAL_TOKEN_ISSUED', 'ci-request-issued', clock_timestamp(), 'ci-approval-001', '{\"singleUse\":true}'::jsonb); UPDATE mira_hfm.authority_approval_nonces SET consumed_at = clock_timestamp() WHERE nonce_hash = repeat('a', 64) AND project_id = 'project-ci' AND actor_id = 'mira:mira.admins:11111111-1111-4111-8111-111111111111' AND consumed_at IS NULL AND expires_at > clock_timestamp(); INSERT INTO mira_hfm.authority_audit_events (event_id, project_id, actor_id, event_type, request_id, occurred_at, approval_ref, details) VALUES ('ci-approval-consumed', 'project-ci', 'mira:mira.admins:11111111-1111-4111-8111-111111111111', 'APPROVAL_TOKEN_CONSUMED', 'ci-request-consumed', clock_timestamp(), 'ci-approval-001', '{\"singleUse\":true}'::jsonb); COMMIT"

          docker exec "$PG" psql -v ON_ERROR_STOP=1 -U postgres -d neondb -c "SELECT 1 / CASE WHEN (SELECT count(*) FROM mira_hfm.authority_approval_nonces WHERE nonce_hash = repeat('a', 64) AND consumed_at IS NOT NULL) = 1 THEN 1 ELSE 0 END"
          docker exec "$PG" psql -v ON_ERROR_STOP=1 -U postgres -d neondb -c "BEGIN; SET LOCAL ROLE mira_hfm_authority_issuer_login; SELECT set_config('mira.project_id', 'project-ci', true); SELECT set_config('mira.actor_id', 'mira:mira.admins:11111111-1111-4111-8111-111111111111', true); UPDATE mira_hfm.authority_approval_nonces SET consumed_at = clock_timestamp() WHERE nonce_hash = repeat('a', 64) AND project_id = 'project-ci' AND actor_id = 'mira:mira.admins:11111111-1111-4111-8111-111111111111' AND consumed_at IS NULL; COMMIT"
          docker exec "$PG" psql -v ON_ERROR_STOP=1 -U postgres -d neondb -c "SELECT 1 / CASE WHEN (SELECT count(*) FROM mira_hfm.authority_approval_nonces WHERE nonce_hash = repeat('a', 64) AND consumed_at IS NOT NULL) = 1 AND (SELECT count(*) FROM mira_hfm.authority_audit_events WHERE event_id = 'ci-approval-consumed') = 1 THEN 1 ELSE 0 END"
          docker exec "$PG" psql -v ON_ERROR_STOP=1 -U postgres -d neondb -c "BEGIN; SET LOCAL ROLE mira_hfm_authority_issuer_login; SELECT set_config('mira.project_id', 'project-ci', true); SELECT set_config('mira.actor_id', 'mira:mira.admins:11111111-1111-4111-8111-111111111111', true); INSERT INTO mira_hfm.authority_approval_nonces (nonce_hash, approval_ref, project_id, actor_id, approver_actor_id, operation, resource, purpose, issued_at, expires_at) VALUES (repeat('b', 64), 'ci-trash-approval-001', 'project-ci', 'mira:mira.admins:11111111-1111-4111-8111-111111111111', 'mira:mira.admins:11111111-1111-4111-8111-111111111111', 'memory.trash', 'memory:social-draft-001', 'manual Facebook publish verified', clock_timestamp(), clock_timestamp() + interval '60 seconds'); INSERT INTO mira_hfm.operation_authorities (authority_id, project_id, actor_id, operation, resource, purpose, request_id, membership_revision, owner_revision, status, issued_by_actor_id, approval_ref, valid_from, expires_at) VALUES ('ci-trash-authority-001', 'project-ci', 'mira:mira.admins:11111111-1111-4111-8111-111111111111', 'memory.trash', 'memory:social-draft-001', 'manual Facebook publish verified', 'ci-trash-request-001', 1, 1, 'ISSUED', 'mira:mira.admins:11111111-1111-4111-8111-111111111111', 'ci-trash-approval-001', clock_timestamp(), clock_timestamp() + interval '60 seconds'); INSERT INTO mira_hfm.authority_audit_events (event_id, project_id, actor_id, event_type, request_id, occurred_at, approval_ref, details) VALUES ('ci-trash-authority-issued', 'project-ci', 'mira:mira.admins:11111111-1111-4111-8111-111111111111', 'AUTHORITY_ISSUED', 'ci-trash-request-001', clock_timestamp(), 'ci-trash-approval-001', '{\"operation\":\"memory.trash\",\"singleUse\":true}'::jsonb); COMMIT"
          docker exec "$PG" psql -v ON_ERROR_STOP=1 -U postgres -d neondb -c "SELECT 1 / CASE WHEN (SELECT count(*) FROM mira_hfm.authority_approval_nonces WHERE nonce_hash = repeat('b', 64) AND operation = 'memory.trash' AND resource = 'memory:social-draft-001') = 1 AND (SELECT count(*) FROM mira_hfm.operation_authorities WHERE authority_id = 'ci-trash-authority-001' AND operation = 'memory.trash' AND resource = 'memory:social-draft-001') = 1 AND (SELECT count(*) FROM mira_hfm.authority_audit_events WHERE event_id = 'ci-trash-authority-issued') = 1 THEN 1 ELSE 0 END"
          if docker exec "$PG" psql -v ON_ERROR_STOP=1 -U postgres -d neondb -c "BEGIN; SET LOCAL ROLE mira_hfm_authority_issuer_login; SELECT set_config('mira.project_id', 'project-ci', true); SELECT set_config('mira.actor_id', 'mira:mira.admins:11111111-1111-4111-8111-111111111111', true); INSERT INTO mira_hfm.operation_authorities (authority_id, project_id, actor_id, operation, resource, purpose, request_id, membership_revision, owner_revision, status, issued_by_actor_id, approval_ref, valid_from, expires_at) VALUES ('ci-purge-authority-001', 'project-ci', 'mira:mira.admins:11111111-1111-4111-8111-111111111111', 'memory.purge', 'memory:social-draft-001', 'not allowed', 'ci-purge-request-001', 1, 1, 'ISSUED', 'mira:mira.admins:11111111-1111-4111-8111-111111111111', 'ci-trash-approval-001', clock_timestamp(), clock_timestamp() + interval '60 seconds'); COMMIT" >/tmp/hfm-unauthorized-operation.log 2>&1; then
            echo "HFM_CI_UNAUTHORIZED_MEMORY_OPERATION_WAS_ALLOWED"
            exit 1
          fi

          if docker exec "$PG" psql -v ON_ERROR_STOP=1 -U postgres -d neondb -c "BEGIN; SET LOCAL ROLE mira_hfm_authority_issuer_login; SELECT set_config('mira.project_id', 'project-ci', true); SELECT set_config('mira.actor_id', 'mira:mira.admins:11111111-1111-4111-8111-111111111111', true); UPDATE mira_hfm.authority_approval_nonces SET nonce_hash = repeat('b', 64) WHERE nonce_hash = repeat('a', 64); COMMIT" >/tmp/hfm-nonce-identity-update.log 2>&1; then
            echo "HFM_CI_NONCE_IDENTITY_UPDATE_WAS_ALLOWED"
            exit 1
          fi
          echo "HFM_BOOTSTRAP_SINGLE_USE_RLS=PASS"
          echo "HFM_BOOTSTRAP_OWNER_WITHOUT_LATCH_BLOCK=PASS"
          echo "HFM_APPROVAL_NONCE_RLS_ISSUE_AND_CONSUME=PASS"
          echo "HFM_APPROVAL_NONCE_REPLAY_BLOCK=PASS"
          echo "HFM_APPROVAL_NONCE_IDENTITY_IMMUTABLE=PASS"
          echo "HFM_MEMORY_TRASH_AUTHORITY_RLS_SCOPE=PASS"
          echo "HFM_MEMORY_PURGE_OPERATION_BLOCK=PASS"

          docker exec "$PG" psql -v ON_ERROR_STOP=1 -U postgres -d neondb -c "BEGIN; SET LOCAL ROLE mira_hfm_memory_writer_login; SELECT 1 / CASE WHEN current_user = 'mira_hfm_memory_writer_login' AND pg_has_role(current_user, 'mira_hfm_memory_writer', 'USAGE') AND has_table_privilege(current_user, 'mira_hfm.memory_records', 'INSERT') AND NOT has_table_privilege(current_user, 'mira_hfm.memory_records', 'UPDATE') AND has_column_privilege(current_user, 'mira_hfm.memory_records', 'lifecycle', 'UPDATE') AND has_column_privilege(current_user, 'mira_hfm.memory_records', 'revision', 'UPDATE') AND has_column_privilege(current_user, 'mira_hfm.memory_records', 'public_payload', 'UPDATE') AND has_column_privilege(current_user, 'mira_hfm.memory_records', 'encrypted_envelope', 'UPDATE') AND has_column_privilege(current_user, 'mira_hfm.memory_records', 'integrity_status', 'UPDATE') AND NOT has_column_privilege(current_user, 'mira_hfm.memory_records', 'trust_status', 'UPDATE') AND NOT has_table_privilege(current_user, 'mira_hfm.operation_authorities', 'UPDATE') AND has_column_privilege(current_user, 'mira_hfm.operation_authorities', 'status', 'UPDATE') AND has_column_privilege(current_user, 'mira_hfm.operation_authorities', 'consumed_at', 'UPDATE') AND NOT has_column_privilege(current_user, 'mira_hfm.operation_authorities', 'purpose', 'UPDATE') AND NOT has_table_privilege(current_user, 'mira_hfm.memory_operation_registry', 'UPDATE') AND has_column_privilege(current_user, 'mira_hfm.memory_operation_registry', 'status', 'UPDATE') AND NOT has_column_privilege(current_user, 'mira_hfm.memory_operation_registry', 'payload_digest', 'UPDATE') AND has_table_privilege(current_user, 'mira_hfm.memory_audit_events', 'INSERT') AND NOT has_table_privilege(current_user, 'mira_hfm.memory_records', 'DELETE') AND NOT has_table_privilege(current_user, 'mira_hfm.memory_records', 'TRUNCATE') AND NOT has_table_privilege(current_user, 'mira_hfm.project_owners', 'UPDATE') THEN 1 ELSE 0 END; ROLLBACK"
          if docker exec "$PG" psql -v ON_ERROR_STOP=1 -U postgres -d neondb -c "BEGIN; SET LOCAL ROLE mira_hfm_memory_writer_login; DELETE FROM mira_hfm.memory_records WHERE project_id = 'project-ci'; COMMIT" >/tmp/hfm-writer-delete.log 2>&1; then
            echo "HFM_CI_MEMORY_WRITER_HARD_DELETE_WAS_ALLOWED"
            exit 1
          fi
          echo "HFM_MEMORY_WRITER_ROLE_EFFECTIVE_PRIVILEGES=PASS"
          echo "HFM_MEMORY_WRITER_HARD_DELETE_BLOCK=PASS"


      - name: Exercise actor-bound Memory writer RLS and authorized canonical writes
        shell: bash
        run: |
          set -euo pipefail
          PG="${{ job.services.postgres.id }}"
          # A permissioned actor with an exact consumed memory.write authority can write one canonical record.
          docker exec "$PG" psql -v ON_ERROR_STOP=1 -U postgres -d neondb -c "INSERT INTO mira_hfm.operation_authorities (authority_id, project_id, actor_id, operation, resource, purpose, request_id, membership_revision, owner_revision, status, issued_by_actor_id, approval_ref, valid_from, expires_at, consumed_at) VALUES ('ci-writer-authority-001', 'project-ci', 'mira:mira.admins:11111111-1111-4111-8111-111111111111', 'memory.write', 'memory:ci-writer-memory-001', 'PostgreSQL CI authorized writer RLS test', 'ci-writer-request-001', 1, 1, 'CONSUMED', 'mira:mira.admins:11111111-1111-4111-8111-111111111111', 'ci-writer-approval-001', clock_timestamp() - interval '1 minute', clock_timestamp() + interval '1 minute', clock_timestamp())"
          docker exec "$PG" psql -v ON_ERROR_STOP=1 -U postgres -d neondb -c "BEGIN; SET LOCAL ROLE mira_hfm_memory_writer_login; SELECT set_config('mira.project_id', 'project-ci', true); SELECT set_config('mira.actor_id', 'mira:mira.admins:11111111-1111-4111-8111-111111111111', true); SELECT set_config('mira.operation', 'memory.write', true); SELECT set_config('mira.resource', 'memory:ci-writer-memory-001', true); SELECT set_config('mira.request_id', 'ci-writer-request-001', true); INSERT INTO mira_hfm.authority_audit_events (event_id, project_id, actor_id, event_type, request_id, occurred_at, approval_ref, details) VALUES ('ci-writer-authority-used', 'project-ci', 'mira:mira.admins:11111111-1111-4111-8111-111111111111', 'AUTHORITY_CONSUMED', 'ci-writer-request-001', clock_timestamp(), 'ci-writer-approval-001', '{\"operation\":\"memory.write\",\"resource\":\"memory:ci-writer-memory-001\"}'::jsonb); INSERT INTO mira_hfm.memory_operation_registry (operation_id, project_id, actor_id, idempotency_key, operation, resource, purpose, payload_digest, status, created_at, updated_at) VALUES ('ci-writer-operation-001', 'project-ci', 'mira:mira.admins:11111111-1111-4111-8111-111111111111', 'ci-writer-idempotency-001', 'memory.write', 'memory:ci-writer-memory-001', 'PostgreSQL CI authorized writer RLS test', repeat('a', 64), 'REQUESTED', clock_timestamp(), clock_timestamp()); INSERT INTO mira_hfm.memory_records (memory_id, project_id, owner_actor_id, record_type, schema_version, classification, lifecycle, revision, integrity_status, trust_status, public_payload, encrypted_envelope, created_at, updated_at) VALUES ('ci-writer-memory-001', 'project-ci', 'mira:mira.admins:11111111-1111-4111-8111-111111111111', 'knowledge_item', '1.1.0', 'PUBLIC', 'ACTIVE', 1, 'VERIFIED', 'HUMAN_VERIFIED', '{\"content\":\"authorized writer RLS test\"}'::jsonb, NULL, clock_timestamp(), clock_timestamp()); INSERT INTO mira_hfm.memory_record_versions (memory_id, project_id, owner_actor_id, record_type, schema_version, classification, lifecycle, revision, integrity_status, trust_status, public_payload, encrypted_envelope, recorded_at) VALUES ('ci-writer-memory-001', 'project-ci', 'mira:mira.admins:11111111-1111-4111-8111-111111111111', 'knowledge_item', '1.1.0', 'PUBLIC', 'ACTIVE', 1, 'VERIFIED', 'HUMAN_VERIFIED', '{\"content\":\"authorized writer RLS test\"}'::jsonb, NULL, clock_timestamp()); INSERT INTO mira_hfm.memory_audit_events (event_id, project_id, actor_id, operation_id, memory_id, event_type, result_status, policy_version, occurred_at, previous_event_hash, event_hash, details) VALUES ('ci-writer-memory-audit-001', 'project-ci', 'mira:mira.admins:11111111-1111-4111-8111-111111111111', 'ci-writer-operation-001', 'ci-writer-memory-001', 'MEMORY_CREATED', 'COMMITTED', 'HFM-MEMORY-1.1.0', clock_timestamp(), NULL, repeat('b', 64), '{}'::jsonb); UPDATE mira_hfm.memory_operation_registry SET status = 'COMPLETED', result_code = 'CI_WRITE_COMMITTED', updated_at = clock_timestamp() WHERE operation_id = 'ci-writer-operation-001' AND status = 'REQUESTED'; COMMIT"
          docker exec "$PG" psql -v ON_ERROR_STOP=1 -U postgres -d neondb -c "SELECT 1 / CASE WHEN (SELECT count(*) FROM mira_hfm.memory_records WHERE memory_id = 'ci-writer-memory-001') = 1 AND (SELECT count(*) FROM mira_hfm.memory_record_versions WHERE memory_id = 'ci-writer-memory-001' AND revision = 1) = 1 AND (SELECT count(*) FROM mira_hfm.memory_audit_events WHERE event_id = 'ci-writer-memory-audit-001') = 1 THEN 1 ELSE 0 END"
          echo "HFM_WRITER_RLS_AUTHORIZED_CANONICAL_WRITE=PASS"
          if docker exec "$PG" psql -v ON_ERROR_STOP=1 -U postgres -d neondb -c "BEGIN; SET LOCAL ROLE mira_hfm_memory_writer_login; UPDATE mira_hfm.memory_records SET public_payload = '{\"content\":\"tampered\"}'::jsonb WHERE memory_id = 'ci-writer-memory-001'; COMMIT" >/tmp/hfm-writer-payload-update.log 2>&1; then
            echo "HFM_CI_WRITER_PAYLOAD_UPDATE_WAS_ALLOWED"
            exit 1
          fi
          grep -Eqi "row-level security|policy" /tmp/hfm-writer-payload-update.log

          if docker exec "$PG" psql -v ON_ERROR_STOP=1 -U postgres -d neondb -c "BEGIN; SET LOCAL ROLE mira_hfm_memory_writer_login; UPDATE mira_hfm.memory_operation_registry SET payload_digest = repeat('c', 64) WHERE operation_id = 'ci-writer-operation-001'; COMMIT" >/tmp/hfm-writer-idempotency-update.log 2>&1; then
            echo "HFM_CI_WRITER_IDEMPOTENCY_IDENTITY_UPDATE_WAS_ALLOWED"
            exit 1
          fi
          grep -qi "permission denied" /tmp/hfm-writer-idempotency-update.log

          if docker exec "$PG" psql -v ON_ERROR_STOP=1 -U postgres -d neondb -c "BEGIN; SELECT set_config('mira.operation', 'memory.trash', true); SELECT set_config('mira.actor_id', 'mira:mira.admins:11111111-1111-4111-8111-111111111111', true); UPDATE mira_hfm.memory_records SET lifecycle = 'TRASHED', trashed_at = statement_timestamp(), trashed_by_actor_id = 'mira:mira.admins:11111111-1111-4111-8111-111111111111', revision = 2, updated_at = statement_timestamp(), public_payload = '{\"content\":\"tampered\"}'::jsonb WHERE memory_id = 'ci-writer-memory-001'; COMMIT" >/tmp/hfm-writer-lifecycle-content-guard.log 2>&1; then
            echo "HFM_CI_LIFECYCLE_TRIGGER_ALLOWED_CONTENT_MUTATION"
            exit 1
          fi
          grep -q "HFM_MEMORY_LIFECYCLE_UPDATE_CONTENT_IMMUTABLE" /tmp/hfm-writer-lifecycle-content-guard.log

          if docker exec "$PG" psql -v ON_ERROR_STOP=1 -U postgres -d neondb -c "UPDATE mira_hfm.memory_operation_registry SET payload_digest = repeat('c', 64) WHERE operation_id = 'ci-writer-operation-001'" >/tmp/hfm-writer-registry-trigger.log 2>&1; then
            echo "HFM_CI_OPERATION_REGISTRY_TRIGGER_ALLOWED_IDENTITY_MUTATION"
            exit 1
          fi
          grep -q "HFM_MEMORY_OPERATION_REGISTRY_TRANSITION_INVALID" /tmp/hfm-writer-registry-trigger.log
          echo "HFM_WRITER_CONTENT_AND_IDEMPOTENCY_MUTATIONS_BLOCKED=PASS"

          # An expired membership row satisfies the historical FK but must not
          # authorize a writer. This reaches the RLS decision instead of failing
          # prematurely while inserting an authority for a nonexistent member.
          WRITER_OUTSIDER="mira:external:33333333-3333-4333-8333-333333333333"
          docker exec "$PG" psql -v ON_ERROR_STOP=1 -U postgres -d neondb -c "INSERT INTO mira_hfm.project_memberships (membership_id, project_id, actor_id, membership_role, permissions, status, revision, valid_from, expires_at, granted_by_actor_id, approval_ref) VALUES ('ci-writer-nonmember-membership', 'project-ci', '$WRITER_OUTSIDER', 'VIEWER', '{\"operations\":[\"memory.write\"]}'::jsonb, 'EXPIRED', 1, clock_timestamp() - interval '2 days', clock_timestamp() - interval '1 day', 'mira:mira.admins:11111111-1111-4111-8111-111111111111', 'ci-writer-nonmember-membership-approval')"
          docker exec "$PG" psql -v ON_ERROR_STOP=1 -U postgres -d neondb -c "INSERT INTO mira_hfm.operation_authorities (authority_id, project_id, actor_id, operation, resource, purpose, request_id, membership_revision, owner_revision, status, issued_by_actor_id, approval_ref, valid_from, expires_at, consumed_at) VALUES ('ci-writer-nonmember-authority', 'project-ci', '$WRITER_OUTSIDER', 'memory.write', 'memory:ci-nonmember-memory', 'PostgreSQL CI nonmember writer RLS test', 'ci-writer-nonmember-request', 1, 1, 'CONSUMED', '$WRITER_OUTSIDER', 'ci-writer-nonmember-approval', clock_timestamp() - interval '1 minute', clock_timestamp() + interval '1 minute', clock_timestamp())"
          if docker exec "$PG" psql -v ON_ERROR_STOP=1 -U postgres -d neondb -c "BEGIN; SET LOCAL ROLE mira_hfm_memory_writer_login; SELECT set_config('mira.project_id', 'project-ci', true); SELECT set_config('mira.actor_id', '$WRITER_OUTSIDER', true); SELECT set_config('mira.operation', 'memory.write', true); SELECT set_config('mira.resource', 'memory:ci-nonmember-memory', true); SELECT set_config('mira.request_id', 'ci-writer-nonmember-request', true); INSERT INTO mira_hfm.memory_records (memory_id, project_id, owner_actor_id, record_type, schema_version, classification, lifecycle, revision, integrity_status, trust_status, public_payload, encrypted_envelope, created_at, updated_at) VALUES ('ci-nonmember-memory', 'project-ci', '$WRITER_OUTSIDER', 'knowledge_item', '1.1.0', 'PUBLIC', 'ACTIVE', 1, 'VERIFIED', 'HUMAN_VERIFIED', '{\"content\":\"must be rejected\"}'::jsonb, NULL, clock_timestamp(), clock_timestamp()); COMMIT" >/tmp/hfm-writer-nonmember-rls.log 2>&1; then
            echo "HFM_CI_WRITER_EXPIRED_MEMBER_INSERT_WAS_ALLOWED"
            exit 1
          fi
          grep -qi "row-level security" /tmp/hfm-writer-nonmember-rls.log
          docker exec "$PG" psql -v ON_ERROR_STOP=1 -U postgres -d neondb -c "SELECT 1 / CASE WHEN (SELECT count(*) FROM mira_hfm.memory_records WHERE memory_id = 'ci-nonmember-memory') = 0 THEN 1 ELSE 0 END"
          echo "HFM_WRITER_RLS_REJECTS_EXPIRED_MEMBER_WITH_CONSUMED_AUTHORITY=PASS"

      - name: Exercise 365-day standing read authority RLS and database-enforced audit
        shell: bash
        run: |
          set -euo pipefail
          PG="${{ job.services.postgres.id }}"
          ACTOR="mira:mira.admins:11111111-1111-4111-8111-111111111111"

          docker exec "$PG" psql -v ON_ERROR_STOP=1 -U postgres -d neondb -c "CREATE ROLE mira_hfm_memory_reader_login LOGIN INHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS"
          docker exec "$PG" psql -v ON_ERROR_STOP=1 -U postgres -d neondb -c "GRANT mira_hfm_memory_reader TO mira_hfm_memory_reader_login"

          # Standing-read RLS must expose only verified Knowledge/Learning records.
          docker exec "$PG" psql -v ON_ERROR_STOP=1 -U postgres -d neondb -c "INSERT INTO mira_hfm.memory_records (memory_id, project_id, owner_actor_id, record_type, schema_version, classification, lifecycle, revision, integrity_status, trust_status, public_payload, encrypted_envelope, created_at, updated_at) VALUES ('ci-knowledge-verified', 'project-ci', '$ACTOR', 'knowledge_item', '1.1.0', 'PUBLIC', 'ACTIVE', 1, 'VERIFIED', 'HUMAN_VERIFIED', '{\"content\":\"verified knowledge\"}'::jsonb, NULL, statement_timestamp(), statement_timestamp()), ('ci-knowledge-pending', 'project-ci', '$ACTOR', 'knowledge_item', '1.1.0', 'PUBLIC', 'ACTIVE', 1, 'VERIFIED', 'SOURCE_RECORDED', '{\"content\":\"pending knowledge\"}'::jsonb, NULL, statement_timestamp(), statement_timestamp()), ('ci-social-draft', 'project-ci', '$ACTOR', 'social_post_draft', '1.1.0', 'PROJECT_PRIVATE', 'ACTIVE', 1, 'VERIFIED', 'HUMAN_VERIFIED', NULL, '{\"ciphertext\":\"ci\"}'::jsonb, statement_timestamp(), statement_timestamp())"

          # An active project member still cannot read Memory without a matching live authority.
          docker exec "$PG" psql -v ON_ERROR_STOP=1 -U postgres -d neondb -c "BEGIN; SET LOCAL ROLE mira_hfm_memory_reader_login; SELECT set_config('mira.project_id', 'project-ci', true); SELECT set_config('mira.actor_id', '$ACTOR', true); SELECT set_config('mira.operation', 'memory.read', true); SELECT set_config('mira.resource', 'memory:project:project-ci', true); SELECT set_config('mira.request_id', 'ci-no-authority-request', true); DO \$\$ BEGIN IF (SELECT count(*) FROM mira_hfm.memory_records WHERE project_id = 'project-ci') <> 0 THEN RAISE EXCEPTION 'HFM_CI_READER_WITHOUT_AUTHORITY_WAS_NOT_BLOCKED'; END IF; END \$\$; COMMIT"

          docker exec "$PG" psql -v ON_ERROR_STOP=1 -U postgres -d neondb -c "BEGIN; SET LOCAL ROLE mira_hfm_authority_issuer_login; SELECT set_config('mira.project_id', 'project-ci', true); SELECT set_config('mira.actor_id', '$ACTOR', true); INSERT INTO mira_hfm.standing_read_authorities (standing_authority_id, project_id, actor_id, operation, resource, purpose, owner_revision, membership_revision, status, approval_ref, approved_by_actor_id, valid_from, expires_at) VALUES ('ci-standing-authority-001', 'project-ci', '$ACTOR', 'memory.read', 'memory:project:project-ci', 'PostgreSQL CI standing read test', 1, 1, 'ACTIVE', 'ci-standing-approval-001', '$ACTOR', statement_timestamp(), statement_timestamp() + interval '365 days'); COMMIT"

          # A standing authority alone is insufficient when the actor has no active project membership.
          OUTSIDER="mira:external:22222222-2222-4222-8222-222222222222"
          docker exec "$PG" psql -v ON_ERROR_STOP=1 -U postgres -d neondb -c "INSERT INTO mira_hfm.standing_read_authorities (standing_authority_id, project_id, actor_id, operation, resource, purpose, owner_revision, membership_revision, status, approval_ref, approved_by_actor_id, valid_from, expires_at) VALUES ('ci-standing-nonmember-001', 'project-ci', '$OUTSIDER', 'memory.read', 'memory:project:project-ci', 'PostgreSQL CI nonmember RLS negative test', 1, 1, 'ACTIVE', 'ci-standing-nonmember-approval-001', '$OUTSIDER', statement_timestamp(), statement_timestamp() + interval '365 days')"
          docker exec "$PG" psql -v ON_ERROR_STOP=1 -U postgres -d neondb -c "BEGIN; SET LOCAL ROLE mira_hfm_memory_reader_login; SELECT set_config('mira.project_id', 'project-ci', true); SELECT set_config('mira.actor_id', '$OUTSIDER', true); SELECT set_config('mira.operation', 'memory.read', true); SELECT set_config('mira.resource', 'memory:project:project-ci', true); SELECT set_config('mira.request_id', 'ci-standing-nonmember-request', true); SELECT set_config('mira.standing_read_authority', 'true', true); DO \$\$ BEGIN IF (SELECT count(*) FROM mira_hfm.memory_records WHERE project_id = 'project-ci') <> 0 THEN RAISE EXCEPTION 'HFM_CI_STANDING_AUTHORITY_BYPASSED_MEMBERSHIP_RLS'; END IF; END \$\$; COMMIT"
          echo "HFM_READER_RLS_REJECTS_STANDING_AUTHORITY_WITHOUT_MEMBERSHIP=PASS"

          # The authorized writer fixture plus verified Knowledge are visible; pending and social-draft records remain excluded.
          docker exec "$PG" psql -v ON_ERROR_STOP=1 -U postgres -d neondb -c "BEGIN; SET LOCAL ROLE mira_hfm_memory_reader_login; SELECT set_config('mira.project_id', 'project-ci', true); SELECT set_config('mira.actor_id', '$ACTOR', true); SELECT set_config('mira.operation', 'memory.read', true); SELECT set_config('mira.resource', 'memory:project:project-ci', true); SELECT set_config('mira.request_id', 'ci-standing-read-request', true); SELECT set_config('mira.standing_read_authority', 'true', true); DO \$\$ BEGIN IF (SELECT count(*) FROM mira_hfm.memory_records WHERE project_id = 'project-ci' AND memory_id IN ('ci-knowledge-verified','ci-writer-memory-001')) <> 2 OR (SELECT count(*) FROM mira_hfm.memory_records WHERE project_id = 'project-ci' AND memory_id IN ('ci-knowledge-pending','ci-social-draft')) <> 0 THEN RAISE EXCEPTION 'HFM_CI_STANDING_READ_RECORD_SCOPE_NOT_ENFORCED'; END IF; END \$\$; COMMIT"
          echo "HFM_STANDING_READ_RLS_LIMITS_TO_VERIFIED_KNOWLEDGE_LEARNING=PASS"

          docker exec "$PG" psql -v ON_ERROR_STOP=1 -U postgres -d neondb -c "BEGIN; SET LOCAL ROLE mira_hfm_memory_reader_login; SELECT set_config('mira.project_id', 'project-ci', true); SELECT set_config('mira.actor_id', '$ACTOR', true); SELECT set_config('mira.operation', 'memory.read', true); SELECT set_config('mira.resource', 'memory:project:project-ci', true); SELECT set_config('mira.request_id', 'ci-standing-read-request', true); DO \$\$ BEGIN IF (SELECT count(*) FROM mira_hfm.standing_read_authorities WHERE standing_authority_id = 'ci-standing-authority-001') <> 1 THEN RAISE EXCEPTION 'HFM_CI_ACTIVE_STANDING_READ_NOT_VISIBLE'; END IF; END \$\$; INSERT INTO mira_hfm.authority_audit_events (event_id, project_id, actor_id, event_type, request_id, occurred_at, approval_ref, details) VALUES ('ci-standing-read-used', 'project-ci', '$ACTOR', 'STANDING_READ_AUTHORITY_USED', 'ci-standing-read-request', clock_timestamp(), 'ci-standing-approval-001', '{\"standingAuthorityId\":\"ci-standing-authority-001\"}'::jsonb); COMMIT"

          # Two overlapping SERIALIZABLE reads must each commit an independent audit row.
          docker exec "$PG" psql -v ON_ERROR_STOP=1 -U postgres -d neondb -c "BEGIN ISOLATION LEVEL SERIALIZABLE; SET LOCAL ROLE mira_hfm_memory_reader_login; SELECT set_config('mira.project_id', 'project-ci', true); SELECT set_config('mira.actor_id', '$ACTOR', true); SELECT set_config('mira.operation', 'memory.read', true); SELECT set_config('mira.resource', 'memory:project:project-ci', true); SELECT set_config('mira.request_id', 'ci-standing-concurrent-request-1', true); DO \$\$ BEGIN IF (SELECT count(*) FROM mira_hfm.standing_read_authorities WHERE standing_authority_id = 'ci-standing-authority-001') <> 1 THEN RAISE EXCEPTION 'HFM_CI_CONCURRENT_STANDING_READ_NOT_AUTHORIZED'; END IF; END \$\$; SELECT pg_sleep(1); INSERT INTO mira_hfm.authority_audit_events (event_id, project_id, actor_id, event_type, request_id, occurred_at, approval_ref, details) VALUES ('ci-standing-concurrent-read-1', 'project-ci', '$ACTOR', 'STANDING_READ_AUTHORITY_USED', 'ci-standing-concurrent-request-1', clock_timestamp(), 'ci-standing-approval-001', '{\"standingAuthorityId\":\"ci-standing-authority-001\"}'::jsonb); COMMIT" >/tmp/hfm-standing-concurrent-read-1.log 2>&1 &
          READ_ONE_PID=$!
          docker exec "$PG" psql -v ON_ERROR_STOP=1 -U postgres -d neondb -c "BEGIN ISOLATION LEVEL SERIALIZABLE; SET LOCAL ROLE mira_hfm_memory_reader_login; SELECT set_config('mira.project_id', 'project-ci', true); SELECT set_config('mira.actor_id', '$ACTOR', true); SELECT set_config('mira.operation', 'memory.read', true); SELECT set_config('mira.resource', 'memory:project:project-ci', true); SELECT set_config('mira.request_id', 'ci-standing-concurrent-request-2', true); DO \$\$ BEGIN IF (SELECT count(*) FROM mira_hfm.standing_read_authorities WHERE standing_authority_id = 'ci-standing-authority-001') <> 1 THEN RAISE EXCEPTION 'HFM_CI_CONCURRENT_STANDING_READ_NOT_AUTHORIZED'; END IF; END \$\$; SELECT pg_sleep(1); INSERT INTO mira_hfm.authority_audit_events (event_id, project_id, actor_id, event_type, request_id, occurred_at, approval_ref, details) VALUES ('ci-standing-concurrent-read-2', 'project-ci', '$ACTOR', 'STANDING_READ_AUTHORITY_USED', 'ci-standing-concurrent-request-2', clock_timestamp(), 'ci-standing-approval-001', '{\"standingAuthorityId\":\"ci-standing-authority-001\"}'::jsonb); COMMIT" >/tmp/hfm-standing-concurrent-read-2.log 2>&1 &
          READ_TWO_PID=$!
          wait "$READ_ONE_PID"
          wait "$READ_TWO_PID"
          docker exec "$PG" psql -v ON_ERROR_STOP=1 -U postgres -d neondb -c "DO \$\$ BEGIN IF (SELECT count(*) FROM mira_hfm.authority_audit_events WHERE project_id = 'project-ci' AND actor_id = '$ACTOR' AND event_type = 'STANDING_READ_AUTHORITY_USED' AND request_id IN ('ci-standing-concurrent-request-1','ci-standing-concurrent-request-2')) <> 2 THEN RAISE EXCEPTION 'HFM_CI_CONCURRENT_STANDING_READ_AUDIT_COUNT_MISMATCH'; END IF; END \$\$;"
          echo "HFM_STANDING_READ_CONCURRENT_DUPLICATE_RETRIEVALS_AUDITED=PASS"

          if docker exec "$PG" psql -v ON_ERROR_STOP=1 -U postgres -d neondb -c "BEGIN; SET LOCAL ROLE mira_hfm_authority_issuer_login; SELECT set_config('mira.project_id', 'project-ci', true); SELECT set_config('mira.actor_id', '$ACTOR', true); UPDATE mira_hfm.standing_read_authorities SET resource = 'memory:project:project-attacker' WHERE standing_authority_id = 'ci-standing-authority-001'; COMMIT" >/tmp/hfm-standing-scope-mutation.log 2>&1; then
            echo "HFM_CI_STANDING_AUTHORITY_SCOPE_MUTATION_WAS_ALLOWED"
            exit 1
          fi

          docker exec "$PG" psql -v ON_ERROR_STOP=1 -U postgres -d neondb -c "BEGIN; SET LOCAL ROLE mira_hfm_authority_issuer_login; SELECT set_config('mira.project_id', 'project-ci', true); SELECT set_config('mira.actor_id', '$ACTOR', true); UPDATE mira_hfm.standing_read_authorities SET status = 'PAUSED', updated_at = clock_timestamp(), paused_at = clock_timestamp() WHERE standing_authority_id = 'ci-standing-authority-001'; COMMIT"
          docker exec "$PG" psql -v ON_ERROR_STOP=1 -U postgres -d neondb -c "BEGIN; SET LOCAL ROLE mira_hfm_memory_reader_login; SELECT set_config('mira.project_id', 'project-ci', true); SELECT set_config('mira.actor_id', '$ACTOR', true); DO \$\$ BEGIN IF (SELECT count(*) FROM mira_hfm.standing_read_authorities WHERE standing_authority_id = 'ci-standing-authority-001') <> 0 THEN RAISE EXCEPTION 'HFM_CI_PAUSED_STANDING_READ_WAS_VISIBLE'; END IF; END \$\$; COMMIT"

          docker exec "$PG" psql -v ON_ERROR_STOP=1 -U postgres -d neondb -c "BEGIN; SET LOCAL ROLE mira_hfm_authority_issuer_login; SELECT set_config('mira.project_id', 'project-ci', true); SELECT set_config('mira.actor_id', '$ACTOR', true); UPDATE mira_hfm.standing_read_authorities SET status = 'ACTIVE', updated_at = clock_timestamp(), paused_at = NULL WHERE standing_authority_id = 'ci-standing-authority-001'; COMMIT"
          docker exec "$PG" psql -v ON_ERROR_STOP=1 -U postgres -d neondb -c "BEGIN; SET LOCAL ROLE mira_hfm_memory_reader_login; SELECT set_config('mira.project_id', 'project-ci', true); SELECT set_config('mira.actor_id', '$ACTOR', true); DO \$\$ BEGIN IF (SELECT count(*) FROM mira_hfm.standing_read_authorities WHERE standing_authority_id = 'ci-standing-authority-001') <> 1 THEN RAISE EXCEPTION 'HFM_CI_RESUMED_STANDING_READ_NOT_VISIBLE'; END IF; END \$\$; COMMIT"

          docker exec "$PG" psql -v ON_ERROR_STOP=1 -U postgres -d neondb -c "BEGIN; SET LOCAL ROLE mira_hfm_authority_issuer_login; SELECT set_config('mira.project_id', 'project-ci', true); SELECT set_config('mira.actor_id', '$ACTOR', true); UPDATE mira_hfm.standing_read_authorities SET status = 'REVOKED', updated_at = clock_timestamp(), paused_at = NULL, revoked_at = clock_timestamp() WHERE standing_authority_id = 'ci-standing-authority-001'; COMMIT"
          docker exec "$PG" psql -v ON_ERROR_STOP=1 -U postgres -d neondb -c "SELECT 1 / CASE WHEN (SELECT count(*) FROM mira_hfm.authority_audit_events WHERE project_id = 'project-ci' AND actor_id = '$ACTOR' AND event_type IN ('STANDING_READ_AUTHORITY_ISSUED','STANDING_READ_AUTHORITY_PAUSED','STANDING_READ_AUTHORITY_RESUMED','STANDING_READ_AUTHORITY_REVOKED')) = 4 AND (SELECT count(*) FROM mira_hfm.authority_audit_events WHERE event_id = 'ci-standing-read-used' AND event_type = 'STANDING_READ_AUTHORITY_USED') = 1 THEN 1 ELSE 0 END"

          if docker exec "$PG" psql -v ON_ERROR_STOP=1 -U postgres -d neondb -c "BEGIN; SET LOCAL ROLE mira_hfm_authority_issuer_login; SELECT set_config('mira.project_id', 'project-ci', true); SELECT set_config('mira.actor_id', '$ACTOR', true); INSERT INTO mira_hfm.standing_read_authorities (standing_authority_id, project_id, actor_id, operation, resource, purpose, owner_revision, membership_revision, status, approval_ref, approved_by_actor_id, valid_from, expires_at) VALUES ('ci-standing-authority-366d', 'project-ci', '$ACTOR', 'memory.read', 'memory:project:project-ci', 'too long', 1, 1, 'ACTIVE', 'ci-standing-approval-366d', '$ACTOR', clock_timestamp(), clock_timestamp() + interval '366 days'); COMMIT" >/tmp/hfm-standing-366d.log 2>&1; then
            echo "HFM_CI_STANDING_AUTHORITY_OVER_365_DAYS_WAS_ALLOWED"
            exit 1
          fi

          echo "HFM_STANDING_READ_RLS_ACTIVE_PAUSED_REVOKED=PASS"
          echo "HFM_STANDING_READ_AUDIT_TRIGGER_ATOMIC_ISSUE_PAUSE_RESUME_REVOKE=PASS"
          echo "HFM_STANDING_READ_SCOPE_IMMUTABLE=PASS"
          echo "HFM_STANDING_READ_365_DAY_MAXIMUM=PASS"

      - name: Verify forced RLS, exact role boundaries and approval nonce privileges
        run: |
          docker exec -i "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U postgres -d neondb <<'SQL'
          DO $$
          DECLARE
            protected_tables integer;
            issuer_policies integer;
            reader_actor_policies integer;
            writer_actor_policies integer;
            standing_scope_policy integer;
          BEGIN
            SELECT count(*) INTO protected_tables
            FROM pg_class c
            JOIN pg_namespace n ON n.oid = c.relnamespace
            WHERE n.nspname = 'mira_hfm'
              AND c.relname IN (
                'project_owners','project_memberships','operation_authorities',
                'authority_audit_events','authority_approval_nonces','memory_records','bootstrap_registry','standing_read_authorities'
              )
              AND c.relrowsecurity AND c.relforcerowsecurity;
            IF protected_tables <> 8 THEN
              RAISE EXCEPTION 'HFM_CI_FORCED_RLS_TABLE_COUNT_MISMATCH: %', protected_tables;
            END IF;

            SELECT count(*) INTO issuer_policies
            FROM pg_policies
            WHERE schemaname = 'mira_hfm'
              AND 'mira_hfm_authority_issuer' = ANY(roles);
            IF issuer_policies <> 10 THEN
              RAISE EXCEPTION 'HFM_CI_ISSUER_POLICY_COUNT_MISMATCH: %', issuer_policies;
            END IF;

            IF NOT has_table_privilege('mira_hfm_authority_issuer', 'mira_hfm.authority_approval_nonces', 'SELECT')
               OR NOT has_table_privilege('mira_hfm_authority_issuer', 'mira_hfm.authority_approval_nonces', 'INSERT')
               OR NOT has_column_privilege('mira_hfm_authority_issuer', 'mira_hfm.authority_approval_nonces', 'consumed_at', 'UPDATE') THEN
              RAISE EXCEPTION 'HFM_CI_ISSUER_NONCE_REQUIRED_PRIVILEGE_MISSING';
            END IF;

            IF has_table_privilege('mira_hfm_authority_issuer', 'mira_hfm.authority_approval_nonces', 'UPDATE')
               OR has_table_privilege('mira_hfm_authority_issuer', 'mira_hfm.authority_approval_nonces', 'DELETE')
               OR has_table_privilege('mira_hfm_authority_issuer', 'mira_hfm.authority_approval_nonces', 'TRUNCATE')
               OR has_column_privilege('mira_hfm_authority_issuer', 'mira_hfm.authority_approval_nonces', 'nonce_hash', 'UPDATE') THEN
              RAISE EXCEPTION 'HFM_CI_ISSUER_NONCE_EXCESS_PRIVILEGE';
            END IF;

            IF has_table_privilege('mira_hfm_memory_reader', 'mira_hfm.memory_records', 'INSERT')
               OR has_table_privilege('mira_hfm_memory_reader', 'mira_hfm.memory_records', 'UPDATE')
               OR has_table_privilege('mira_hfm_memory_reader', 'mira_hfm.memory_records', 'DELETE') THEN
              RAISE EXCEPTION 'HFM_CI_MEMORY_READER_EXCESS_PRIVILEGE';
            END IF;

            IF has_table_privilege('mira_hfm_authority_issuer', 'mira_hfm.operation_authorities', 'UPDATE')
               OR has_table_privilege('mira_hfm_authority_issuer', 'mira_hfm.operation_authorities', 'DELETE') THEN
              RAISE EXCEPTION 'HFM_CI_ISSUER_AUTHORITY_EXCESS_PRIVILEGE';
            END IF;
            SELECT count(*) INTO reader_actor_policies
            FROM pg_policies
            WHERE schemaname = 'mira_hfm'
              AND policyname IN (
                'hfm_reader_membership_permission','hfm_reader_consumed_authority_scope',
                'hfm_reader_consume_exact_authority','hfm_reader_authority_audit_request_scope',
                'hfm_reader_memory_membership_authority_scope'
              )
              AND permissive = 'RESTRICTIVE'
              AND 'mira_hfm_memory_reader' = ANY(roles);
            IF reader_actor_policies <> 5 THEN
              RAISE EXCEPTION 'HFM_CI_READER_ACTOR_RLS_POLICY_COUNT_MISMATCH: %', reader_actor_policies;
            END IF;

            SELECT count(*) INTO writer_actor_policies
            FROM pg_policies
            WHERE schemaname = 'mira_hfm'
              AND policyname IN (
                'hfm_writer_owner_active','hfm_writer_membership_permission',
                'hfm_writer_consumed_authority_scope','hfm_writer_consume_exact_authority',
                'hfm_writer_consumed_authority_audit','hfm_writer_memory_record_select_scope',
                'hfm_writer_memory_record_insert_scope','hfm_writer_memory_record_update_scope',
                'hfm_writer_memory_version_insert_scope','hfm_writer_operation_registry_scope',
                'hfm_writer_memory_audit_select_scope','hfm_writer_memory_audit_insert_scope'
              )
              AND permissive = 'RESTRICTIVE'
              AND 'mira_hfm_memory_writer' = ANY(roles);
            IF writer_actor_policies <> 12 THEN
              RAISE EXCEPTION 'HFM_CI_WRITER_ACTOR_RLS_POLICY_COUNT_MISMATCH: %', writer_actor_policies;
            END IF;

            SELECT count(*) INTO standing_scope_policy
            FROM pg_policies
            WHERE schemaname = 'mira_hfm'
              AND tablename = 'memory_records'
              AND policyname = 'hfm_standing_reader_memory_scope'
              AND permissive = 'RESTRICTIVE'
              AND 'mira_hfm_memory_reader' = ANY(roles)
              AND qual LIKE '%learning_note%'
              AND qual LIKE '%knowledge_item%'
              AND qual LIKE '%ACTIVE%'
              AND qual LIKE '%PUBLIC%'
              AND qual LIKE '%PROJECT_PRIVATE%'
              AND qual LIKE '%integrity_status%'
              AND qual LIKE '%trust_status%';
            IF standing_scope_policy <> 1 THEN
              RAISE EXCEPTION 'HFM_CI_STANDING_READ_SCOPE_POLICY_MISSING_OR_WEAK';
            END IF;
          END;
          $$;
          SELECT 'HFM_POSTGRES_MIGRATION_CHAIN=PASS';
          SELECT 'HFM_FORCED_RLS_AND_ROLE_PRIVILEGES=PASS';
          SELECT 'HFM_APPROVAL_NONCE_SINGLE_COLUMN_UPDATE=PASS';
          SELECT 'HFM_READER_ACTOR_MEMBERSHIP_OPERATION_RLS=PASS';
          SELECT 'HFM_WRITER_ACTOR_MEMBERSHIP_OPERATION_RLS=PASS';
          SELECT 'HFM_STANDING_READ_RESTRICTIVE_SCOPE_POLICY=PASS';
          SQL
