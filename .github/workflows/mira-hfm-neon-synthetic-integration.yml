name: Mira HFM disposable Neon synthetic integration

on:
  workflow_dispatch:
    inputs:
      confirm_disposable_branch:
        description: "Type the exact confirmation only after creating a NEW disposable Neon test branch"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mira-hfm-neon-synthetic-integration
  cancel-in-progress: false

jobs:
  synthetic-neon-integration:
    if: ${{ inputs.confirm_disposable_branch == 'I_CREATED_A_DISPOSABLE_NEON_BRANCH' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: hfm-disposable-neon
    env:
      MIRA_HFM_TEST_DATABASE_URL: ${{ secrets.MIRA_HFM_TEST_DATABASE_URL }}
      MIRA_HFM_TEST_DATABASE_ALLOW_WRITES: I_CREATED_A_DISPOSABLE_NEON_BRANCH
      NODE_ENV: test
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Require disposable test database secret
        shell: bash
        run: |
          if [ -z "${MIRA_HFM_TEST_DATABASE_URL:-}" ]; then
            echo "HFM_NEON_TEST_DATABASE=NOT_APPROVED"
            echo "Configure MIRA_HFM_TEST_DATABASE_URL as an environment secret in hfm-disposable-neon."
            exit 2
          fi
      - name: Run isolated synthetic Neon transaction test
        run: npm run test:hfm-neon-synthetic
