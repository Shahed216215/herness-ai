name: Mira HFM disposable Neon synthetic integration

on:
  push:
    branches:
      - work/hfm-memory-core-implementation-20261106
    paths:
      - ".github/workflows/mira-hfm-neon-synthetic-integration.yml"
      - "tests/hfm-neon-synthetic-integration.test.js"
  workflow_dispatch:
    inputs:
      confirm_disposable_branch:
        description: "Type the exact confirmation only after creating a NEW disposable Neon test branch"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mira-hfm-neon-synthetic-integration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  static-contract:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax-check synthetic integration test
        run: node --check tests/hfm-neon-synthetic-integration.test.js

  synthetic-neon-integration:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_disposable_branch == 'I_CREATED_A_DISPOSABLE_NEON_BRANCH' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: hfm-disposable-neon
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Require disposable test configuration
        shell: bash
        env:
          MIRA_HFM_TEST_DATABASE_URL: ${{ secrets.MIRA_HFM_TEST_DATABASE_URL }}
          MIRA_HFM_PRODUCTION_DATABASE_HOST: ${{ vars.MIRA_HFM_PRODUCTION_DATABASE_HOST }}
        run: |
          if [ -z "${MIRA_HFM_TEST_DATABASE_URL:-}" ] || [ -z "${MIRA_HFM_PRODUCTION_DATABASE_HOST:-}" ]; then
            echo "HFM_NEON_TEST_DATABASE=NOT_APPROVED"
            echo "Configure environment secret MIRA_HFM_TEST_DATABASE_URL and environment variable MIRA_HFM_PRODUCTION_DATABASE_HOST in hfm-disposable-neon."
            exit 2
          fi
      - name: Run isolated synthetic Neon transaction test
        env:
          MIRA_HFM_TEST_DATABASE_URL: ${{ secrets.MIRA_HFM_TEST_DATABASE_URL }}
          MIRA_HFM_PRODUCTION_DATABASE_HOST: ${{ vars.MIRA_HFM_PRODUCTION_DATABASE_HOST }}
          MIRA_HFM_TEST_DATABASE_ALLOW_WRITES: I_CREATED_A_DISPOSABLE_NEON_BRANCH
          NODE_ENV: test
        run: npm run test:hfm-neon-synthetic
