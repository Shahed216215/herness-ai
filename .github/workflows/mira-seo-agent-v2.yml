name: Mira SEO Agent v2 Offline Tests

on:
  pull_request:
    branches:
      - 'work/mira-hfm-v02-phase9-restack-on-current-phase8-20261106'
    paths:
      - 'services/mira-seo-engine.js'
      - 'tools/seo-audit.js'
      - 'tests/mira-seo-engine.test.js'
      - 'tests/mira-seo-research-orchestrator.test.js'
      - 'tests/mira-marketing-workflow-orchestrator.test.js'
      - 'tests/mira-seo-review-dispatch.test.js'
      - 'docs/seo/**'
      - '.github/workflows/mira-seo-agent-v2.yml'
  push:
    branches:
      - 'work/mira-seo-agent-v2-20261106'
    paths:
      - 'services/mira-seo-engine.js'
      - 'tools/seo-audit.js'
      - 'tests/mira-seo-engine.test.js'
      - 'tests/mira-seo-research-orchestrator.test.js'
      - 'tests/mira-marketing-workflow-orchestrator.test.js'
      - 'tests/mira-seo-review-dispatch.test.js'
      - 'docs/seo/**'
      - '.github/workflows/mira-seo-agent-v2.yml'

permissions:
  contents: read

jobs:
  seo-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax check
        run: node --check services/mira-seo-engine.js && node --check tools/seo-audit.js && node --check tests/mira-seo-engine.test.js
      - name: SEO engine regression
        run: node tests/mira-seo-engine.test.js
      - name: Governed research and workflow regressions
        run: node tests/mira-seo-research-orchestrator.test.js && node tests/mira-marketing-workflow-orchestrator.test.js && node tests/mira-seo-review-dispatch.test.js
