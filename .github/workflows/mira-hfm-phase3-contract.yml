name: Mira HFM Phase 3 Contract Tests

on:
  push:
    branches:
      - work/mira-hfm-v02-phase3-unified-memory-contract-core
    paths:
      - 'services/mira-memory-request-authorization.js'
      - 'tests/mira-memory-request-authorization.test.js'
      - 'services/mira-memory-project-mapping-contract.js'
      - 'tests/mira-memory-project-mapping-contract.test.js'
      - 'services/mira-memory-unified-facade.js'
      - 'services/mira-memory-domain-payload-adapter.js'
      - 'tests/mira-memory-domain-payload-adapter.test.js'
      - 'tests/mira-memory-unified-facade.test.js'
      - '.github/workflows/mira-hfm-phase3-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  request-authorization-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run isolated request authorization contract tests
        run: |
          set -euo pipefail
          node tests/mira-memory-request-authorization.test.js
          node tests/mira-memory-project-mapping-contract.test.js
          node tests/mira-memory-unified-facade.test.js
          node tests/mira-memory-domain-payload-adapter.test.js
      - name: Report isolation boundary
        run: |
          echo "PRODUCTION_MEMORY_TOUCHED=NO"
          echo "LIVE_PROVIDER_CALLS=NO"
          echo "NETWORK_REQUESTS_FROM_TEST=0"
          echo "EXTERNAL_ACTIONS_FROM_TEST=0"
          echo "RESULT=MIRA_HFM_PHASE3_UNIFIED_CONTRACT_CI_COMPLETE"
