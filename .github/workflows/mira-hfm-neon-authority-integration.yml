name: Mira HFM Neon authority integration

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mira-hfm-neon-authority-integration
  cancel-in-progress: false

jobs:
  disposable-neon-authority:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted workflow revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Checkout reviewed HFM candidate
        uses: actions/checkout@v4
        with:
          ref: b3f07db5d5d46692f37f919cf50509523521b2c4
          path: candidate
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install candidate production dependencies
        run: npm ci --prefix candidate --ignore-scripts --omit=dev --no-audit --no-fund

      - name: Run disposable Neon authority transaction integration
        env:
          MIRA_HFM_AUTHORITY_TEST_DATABASE_URL: ${{ secrets.MIRA_HFM_AUTHORITY_TEST_DATABASE_URL }}
        run: node candidate/tests/mira-hfm-authority-neon-integration.test.js
